# Routes each <party>.localhost to that party's web app, <party>-web, by the
# Host header: plain HTTP, as the demo leaves out the report's TLS. The proxy
# sits only on the parties' web networks, so a name reaches a web app or
# nothing (502).
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {}

http {
    # Docker's own DNS, asked at request time: a restarted web app is found again.
    resolver 127.0.0.11 valid=10s;
    access_log off;
    # Run as the demo user: every temp folder in /tmp, none in /var/cache.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Any name outside .localhost reaches no web app.
    server {
        listen 8080 default_server;
        return 421;
    }

    server {
        listen 8080;
        server_name ~^(?<party>[a-z0-9-]+)\.localhost$;
        location / {
            proxy_pass http://$party-web:8000;
            proxy_set_header Host $host;
        }
    }
}
