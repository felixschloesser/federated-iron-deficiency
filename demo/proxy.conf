# Generated by `python -m demo.topology` from demo/demo.toml: edit that.
# Routes each <party>.localhost to that party's web app by the Host header:
# plain HTTP, as the demo leaves out the report's TLS.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {}

http {
    # Docker's own DNS, asked at request time: a restarted web app is found again.
    resolver 127.0.0.11 valid=10s;
    access_log off;
    # Run as the demo user: every temp folder in /tmp, none in /var/cache.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $host $web_app {
        uz-leuven.localhost                    uz-leuven-web:8000;
        heilig-hart-leuven.localhost           heilig-hart-leuven-web:8000;
        az-diest.localhost                     az-diest-web:8000;
        huisartsenpraktijk-de-akker.localhost  huisartsenpraktijk-de-akker-web:8000;
        huisartsenpraktijk-de-berk.localhost   huisartsenpraktijk-de-berk-web:8000;
        huisartsenpraktijk-de-ceder.localhost  huisartsenpraktijk-de-ceder-web:8000;
        # Any other name reaches no web app.
        default                                "";
    }

    server {
        listen 8080;
        if ($web_app = "") {
            return 421;
        }
        location / {
            proxy_pass http://$web_app;
            proxy_set_header Host $host;
        }
    }
}
