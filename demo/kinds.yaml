# How each kind of service in compose.yaml runs. Its services extend these
# (`extends: {file: kinds.yaml, service: …}`), which merges them key by key:
# a service adds its own environment, volumes and networks to its kind's.
# Nothing here starts on its own: compose.yaml names every service that runs.

services:
  # A long-running demo container. Every container that touches a party's
  # volume runs as our images' app user, who owns the folders each image
  # brings; Docker copies those folders into a fresh volume, so no container
  # needs root to hand a volume over. The health check runs every 2 s while the
  # container starts, so `up --wait` returns quickly, and every 5 minutes once
  # it is healthy, because each check starts a process in the container. Each
  # kind or service sets its own check command.
  server:
    user: "1000:1000"
    restart: unless-stopped
    healthcheck:
      start_period: 2m
      start_interval: 2s
      interval: 5m

  # A party's setup job: it migrates the party's database, seeds it from the
  # party's own NHANES extract (mounted read-only at /nhanes), registers the
  # parties it knows, named as its people would type them, and exits. The demo
  # accounts share a known password, so DEBUG is on here only. It has no
  # network, as it needs none. Every step is idempotent, so a restart is quick.
  # It is the first container on a fresh volume, so Docker gives it the folders
  # the party's image brings. The party's servers start once it has succeeded.
  setup:
    user: "1000:1000"
    network_mode: none
    environment:
      DJANGO_DEBUG: "1"
      DATA_DIR: /data

  hospital-setup:
    extends: setup
    image: ${COMPOSE_PROJECT_NAME}-hospital-web
    depends_on:
      nhanes-download: {condition: service_completed_successfully}
    environment:
      DJANGO_SETTINGS_MODULE: web.hospital.settings

  practice-setup:
    extends: setup
    image: ${COMPOSE_PROJECT_NAME}-practice-web
    depends_on:
      nhanes-download: {condition: service_completed_successfully}
    environment:
      DJANGO_SETTINGS_MODULE: web.practice.settings

  startup-setup:
    extends: setup
    image: ${COMPOSE_PROJECT_NAME}-startup-web
    environment:
      DJANGO_SETTINGS_MODULE: web.startup.settings

  # A web app runs gunicorn on its party's volume once its setup job is done. It
  # is ready when its login page answers, which needs its settings, URLconf,
  # templates and stylesheets. DEBUG is off. It serves plain HTTP because the
  # demo leaves out TLS (tests/quality/security/test_compose.py).
  web:
    extends: server
    command: [gunicorn, web.shared.wsgi, --bind=0.0.0.0:8000, --workers=2, --access-logfile=-]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/login/', timeout=5)"]

  # A hospital's web app. The laboratory director provides the training cohort
  # and fetches screening models here, so it writes the cohort and
  # screening-models folders, through the hospital's whole volume. It holds no
  # SuperNode key. It joins the screening-models network to fetch from the
  # startup and serves nothing there.
  hospital-web:
    extends: web
    image: ${COMPOSE_PROJECT_NAME}-hospital-web
    environment:
      DJANGO_SETTINGS_MODULE: web.hospital.settings
      DATA_DIR: /data
      # The startup's screening-models endpoint.
      STARTUP_ADDRESS: startup-grpc:8442

  # A hospital's lab-order endpoint, the only thing the practices reach at a
  # hospital (tests/quality/security/test_running_containers.py).
  hospital-grpc:
    extends: server
    image: ${COMPOSE_PROJECT_NAME}-hospital-web
    command: [python, manage.py, grpcrunserver, 0.0.0.0:8441]
    environment:
      DJANGO_SETTINGS_MODULE: web.hospital.settings
      DATA_DIR: /data
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('localhost', 8441)).close()"]
    networks: [lab-orders]

  # A practice's web app: Django and gRPC only, without the training package's
  # dependencies.
  practice-web:
    extends: web
    image: ${COMPOSE_PROJECT_NAME}-practice-web
    environment:
      DJANGO_SETTINGS_MODULE: web.practice.settings
      DATA_DIR: /data

  # Flower's SuperExec with our dependencies: it runs the ServerApp at the
  # startup and a ClientApp at each hospital. No health check, because nothing
  # waits on it.
  superexec:
    image: ${COMPOSE_PROJECT_NAME}-superexec
    user: "1000:1000"
    restart: unless-stopped

  # A hospital's SuperNode. Its ClientApp, the startup's code running at the
  # hospital, mounts only the cohort folder, read-only, so it can write nothing
  # at the hospital, and its network reaches nothing but the SuperNode
  # (tests/quality/security/test_running_containers.py). The cohort folder
  # belongs to the hospital; the hospital's image brings it. A SuperNode is
  # ready when its ClientApp can connect.
  supernode:
    extends: server
    image: flwr/supernode:1.40.0
    environment:
      FLWR_HOME: /tmp/flwr
    depends_on:
      flower-superlink: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('localhost', 9094)).close()"]
