# The demo's parties (demo/README.md): each hospital, keyed as ml.dataset
# names it, with the general practitioner's practice whose primary laboratory
# it is; every practice may send samples to every hospital (features/practice/ordering.feature).
# How each hospital trains (its NHANES cycle and sample) is the startup's
# choice and stays in its app; this file never reaches the FAB.

[hospitals.uz-leuven]
colour = "jade"                                   # Pico theme of its web app
practice = "Huisartsenpraktijk De Akker"          # fictional; Heverlee
practice_colour = "green"                         # same family as the hospital's
patients = 40                                     # the practice's, sized like the hospital
provided = true                                   # its laboratory director provided the training cohort

[hospitals.heilig-hart-leuven]
colour = "pumpkin"
practice = "Huisartsenpraktijk De Berk"           # fictional; Kessel-Lo
practice_colour = "amber"
patients = 24
provided = true

[hospitals.az-diest]
colour = "violet"
practice = "Huisartsenpraktijk De Ceder"          # fictional; Diest
practice_colour = "purple"
patients = 12
provided = false                                  # so a run shows a hospital taking no part
