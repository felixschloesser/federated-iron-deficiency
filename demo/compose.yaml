# Generated by `python -m demo.topology` from demo/demo.toml: edit that.
# The demo (demo/README.md): one container per service, one network per
# trust boundary of the report's DFDs, and one per crossing, and one volume
# per party: every container mounts only its own party's parts of it, at the
# path prepare wrote them to. Only prepare also mounts .demo/ on the host.
#
#   docker compose up --build --abort-on-container-failure
#   docker compose run --rm train
#   docker compose down -v          # start over; .demo/ on the host stays
#
# Browsers reach http://<party>.localhost through the proxy, the only
# published port. Networks: startup (TB2), startup-web (the startup's web app and the proxy), <hospital> (TB1), <hospital>-flower-client-app (TB4,
# internal), <practice> (TB3); model-updates crosses TB2-TB1 (DF7-DF10),
# messaging crosses TB3-TB1 (DF23, DF25): every practice reaches every hospital's
# endpoint there, by the alias <hospital>-messaging.

name: iron-deficiency

# Each image is built once, by the first service that names it (prepare,
# flower-server-app, the first practice); every other service uses it as built.
# Every container runs as one user, so the volumes and, on Linux, where a bind
# mount keeps numeric IDs, .demo/ never mix the images' own users (49999, 1000).
# Set DEMO_USER=$(id -u):$(id -g) in .env if your account is not 1000:1000.
x-user: &user "${DEMO_USER:-1000:1000}"

# Checked every 2 s while a service starts, so `up --wait` is quick; once it
# is healthy, every 5 minutes: each check starts a process in the container.
x-health: &health
  start_period: 2m
  start_interval: 2s
  interval: 5m

x-web: &web
  image: ${COMPOSE_PROJECT_NAME}-web
  user: *user
  depends_on:
    prepare: {condition: service_completed_successfully}

# A practice's web app: Django and gRPC only, no training package dependencies.
x-practice-web: &practice-web
  image: ${COMPOSE_PROJECT_NAME}-practice-web
  user: *user
  depends_on:
    prepare: {condition: service_completed_successfully}

x-superexec: &superexec
  image: ${COMPOSE_PROJECT_NAME}-superexec
  user: *user

x-supernode: &supernode
  image: flwr/supernode:1.40.0
  user: *user
  environment:
    FLWR_HOME: /tmp/flwr
  depends_on:
    flower-superlink: {condition: service_healthy}

services:
  # Out-of-band setup, not drawn in the DFDs: lab records,
  # databases. The one container that sees every party's folder.
  prepare:
    <<: *web
    build: {context: .., dockerfile: demo/web.Dockerfile}
    depends_on: {}
    # A fresh volume belongs to root: hand each to the demo user, then drop to it.
    user: root
    entrypoint:
      - bash
      - -c
      - |
        chown "$$DEMO_USER" /demo/startup /demo/hospitals/* /demo/practices/* /demo/huggingface
        exec setpriv --reuid="$${DEMO_USER%%:*}" --regid="$${DEMO_USER##*:}" --clear-groups "$$@"
      - prepare
    command: [python, -m, demo.demo, prepare, --demo-dir, /demo]
    environment:
      DEMO_USER: *user
      # Hugging Face may refuse unauthenticated downloads of the NHANES data.
      HF_TOKEN: ${HF_TOKEN:-}
      # Downloads stay on the host, so a reset fetches nothing twice.
      HF_HOME: /demo/huggingface
      # Only for the summary's addresses.
      DEMO_HTTP_PORT: ${DEMO_HTTP_PORT:-80}
    volumes:
      - {type: volume, source: startup, target: /demo/startup}
      - {type: volume, source: uz-leuven, target: /demo/hospitals/uz-leuven}
      - {type: volume, source: heilig-hart-leuven, target: /demo/hospitals/heilig-hart-leuven}
      - {type: volume, source: az-diest, target: /demo/hospitals/az-diest}
      - {type: volume, source: huisartsenpraktijk-de-akker, target: /demo/practices/huisartsenpraktijk-de-akker}
      - {type: volume, source: huisartsenpraktijk-de-berk, target: /demo/practices/huisartsenpraktijk-de-berk}
      - {type: volume, source: huisartsenpraktijk-de-ceder, target: /demo/practices/huisartsenpraktijk-de-ceder}
      # On the host, kept by `down -v`: the downloads.
      - ../.demo/huggingface:/demo/huggingface
    networks: [setup]

  # TB2, the startup.
  flower-superlink:
    image: flwr/superlink:1.40.0
    user: *user
    environment:
      FLWR_HOME: /tmp/flwr
    depends_on:
      prepare: {condition: service_completed_successfully}
    command:
      - --host=0.0.0.0
      - --port=9092
      - --database=/demo/startup/superlink/state.db
      - --isolation=process
      # Plaintext, any node admitted: the report's TLS and SuperNode
      # authentication are left out of the demo for simplicity.
      - --insecure
    volumes:
      - {type: volume, source: startup, target: /demo/startup/superlink, volume: {subpath: superlink}}
    networks: [startup, model-updates]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import socket; socket.create_connection(('localhost', 9092))"]

  flower-server-app:
    <<: *superexec
    build: {context: .., dockerfile: demo/superexec.Dockerfile}
    depends_on:
      flower-superlink: {condition: service_healthy}
    command:
      - --runtime-api-address=flower-superlink:9092
      - --insecure
    volumes:
      - {type: volume, source: startup, target: /demo/startup/final-models, volume: {subpath: final-models}}
    networks: [startup]

  # E1, the data scientist, submits from inside TB2: `docker compose run --rm train`.
  train:
    <<: *web
    profiles: [train]
    depends_on:
      flower-superlink: {condition: service_healthy}
    command: [flwr, run, /app, demo, --run-config, "demo-dir='/demo'", --stream]
    environment:
      FLWR_HOME: /demo/startup/flwr-home
    volumes:
      - {type: volume, source: startup, target: /demo/startup/flwr-home, volume: {subpath: flwr-home}}
    networks: [startup]

  # The startup's web app: its data scientist sees the final models, submits
  # training runs and releases final models. One container, two servers, each on
  # a name only one network knows: the proxy reaches the pages, the hospitals'
  # web apps only the final-models endpoint (P12, features/startup/release.feature).
  # On startup to reach the SuperLink, which so neither the proxy nor a hospital reaches.
  startup-web:
    <<: *web
    command:
      - bash
      - -c
      - |
        trap 'kill $$(jobs -p)' TERM INT
        gunicorn web.wsgi --bind=startup-pages:8000 --workers=2 --access-logfile=- &
        python manage.py serve_final_models startup-final-models:8442 &
        wait -n
        exit 1
    restart: unless-stopped
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import socket, urllib.request; urllib.request.urlopen(urllib.request.Request('http://startup-pages:8000/login/', headers={'Host': 'localhost'}), timeout=5); socket.create_connection(('startup-final-models', 8442)).close()"]
    environment:
      PARTY: startup
      DATA_DIR: /demo/startup
      FLWR_HOME: /demo/startup/flwr-home
    volumes:
      - {type: volume, source: startup, target: /demo/startup}
      - {type: volume, source: startup, target: /demo/startup/final-models, read_only: true, volume: {subpath: final-models}}
    # Masked: the SuperLink's state (DS3) is the SuperLink's alone.
    tmpfs: [/demo/startup/superlink]
    networks:
      startup: {}
      startup-web: {aliases: [startup-pages]}
      final-models: {aliases: [startup-final-models]}

  # TB1 and TB4, UZ Leuven.
  uz-leuven-flower-supernode:
    <<: *supernode
    command:
      - --superlink=flower-superlink:9092
      - --insecure
      - --isolation=process
      - --host=0.0.0.0
      - --port=9094
      - --node-config=data-path='/demo/hospitals/uz-leuven/cohort'
    networks: [model-updates, uz-leuven-flower-client-app]

  # The startup's code at the hospital (TB4): only the cohort, read-only, so it
  # writes nothing at the hospital, and a network that reaches nothing but its
  # SuperNode (tests/quality/security/test_running_containers.py).
  uz-leuven-flower-client-app:
    <<: *superexec
    depends_on: [uz-leuven-flower-supernode]
    command: [--runtime-api-address=uz-leuven-flower-supernode:9094, --insecure]
    volumes:
      - {type: volume, source: uz-leuven, target: /demo/hospitals/uz-leuven/cohort, read_only: true, volume: {subpath: cohort}}
    networks: [uz-leuven-flower-client-app]

  uz-leuven-web:
    <<: *web
    # One container, two servers, each on a name only one network knows: the
    # proxy reaches the pages, the practice only the lab-order endpoint (tests/quality/security/test_running_containers.py).
    # Either one stopping stops the container, and compose restarts it.
    command:
      - bash
      - -c
      - |
        trap 'kill $$(jobs -p)' TERM INT
        gunicorn web.wsgi --bind=uz-leuven-pages:8000 --workers=2 --access-logfile=- &
        python manage.py serve_messages uz-leuven-messaging:8441 &
        wait -n
        exit 1
    restart: unless-stopped
    # Ready when both servers answer, each on its own network's name; the pages
    # under a name ALLOWED_HOSTS knows.
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import socket, urllib.request; urllib.request.urlopen(urllib.request.Request('http://uz-leuven-pages:8000/login/', headers={'Host': 'localhost'}), timeout=5); socket.create_connection(('uz-leuven-messaging', 8441)).close()"]
    environment:
      PARTY: hospital
      DATA_DIR: /demo/hospitals/uz-leuven
      PARTY_NAME: UZ Leuven
      PARTY_COLOUR: jade
      # The startup's final-models endpoint, and the name the startup issued this
      # hospital (features/hospital/fetch.feature).
      STARTUP_ADDRESS: startup-final-models:8442
      HOSPITAL_CERTIFICATE_NAME: uz-leuven
    volumes:
      - {type: volume, source: uz-leuven, target: /demo/hospitals/uz-leuven}
    # The laboratory director provides the training cohort and fetches final
    # models here, so the web app writes the cohort folder and screening-models,
    # through the hospital's whole volume (features/hospital/training_cohort.feature,
    # features/hospital/fetch.feature); it holds no SuperNode key.
    # DEBUG off; plain HTTP, as the demo leaves out the report's TLS (tests/quality/security/test_compose.py).
    networks:
      uz-leuven: {aliases: [uz-leuven-pages]}
      messaging: {aliases: [uz-leuven-messaging]}
      final-models: {}

  # TB1 and TB4, Heilig Hart Leuven.
  heilig-hart-leuven-flower-supernode:
    <<: *supernode
    command:
      - --superlink=flower-superlink:9092
      - --insecure
      - --isolation=process
      - --host=0.0.0.0
      - --port=9094
      - --node-config=data-path='/demo/hospitals/heilig-hart-leuven/cohort'
    networks: [model-updates, heilig-hart-leuven-flower-client-app]

  # The startup's code at the hospital (TB4): only the cohort, read-only, so it
  # writes nothing at the hospital, and a network that reaches nothing but its
  # SuperNode (tests/quality/security/test_running_containers.py).
  heilig-hart-leuven-flower-client-app:
    <<: *superexec
    depends_on: [heilig-hart-leuven-flower-supernode]
    command: [--runtime-api-address=heilig-hart-leuven-flower-supernode:9094, --insecure]
    volumes:
      - {type: volume, source: heilig-hart-leuven, target: /demo/hospitals/heilig-hart-leuven/cohort, read_only: true, volume: {subpath: cohort}}
    networks: [heilig-hart-leuven-flower-client-app]

  heilig-hart-leuven-web:
    <<: *web
    # One container, two servers, each on a name only one network knows: the
    # proxy reaches the pages, the practice only the lab-order endpoint (tests/quality/security/test_running_containers.py).
    # Either one stopping stops the container, and compose restarts it.
    command:
      - bash
      - -c
      - |
        trap 'kill $$(jobs -p)' TERM INT
        gunicorn web.wsgi --bind=heilig-hart-leuven-pages:8000 --workers=2 --access-logfile=- &
        python manage.py serve_messages heilig-hart-leuven-messaging:8441 &
        wait -n
        exit 1
    restart: unless-stopped
    # Ready when both servers answer, each on its own network's name; the pages
    # under a name ALLOWED_HOSTS knows.
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import socket, urllib.request; urllib.request.urlopen(urllib.request.Request('http://heilig-hart-leuven-pages:8000/login/', headers={'Host': 'localhost'}), timeout=5); socket.create_connection(('heilig-hart-leuven-messaging', 8441)).close()"]
    environment:
      PARTY: hospital
      DATA_DIR: /demo/hospitals/heilig-hart-leuven
      PARTY_NAME: Heilig Hart Leuven
      PARTY_COLOUR: pumpkin
      # The startup's final-models endpoint, and the name the startup issued this
      # hospital (features/hospital/fetch.feature).
      STARTUP_ADDRESS: startup-final-models:8442
      HOSPITAL_CERTIFICATE_NAME: heilig-hart-leuven
    volumes:
      - {type: volume, source: heilig-hart-leuven, target: /demo/hospitals/heilig-hart-leuven}
    # The laboratory director provides the training cohort and fetches final
    # models here, so the web app writes the cohort folder and screening-models,
    # through the hospital's whole volume (features/hospital/training_cohort.feature,
    # features/hospital/fetch.feature); it holds no SuperNode key.
    # DEBUG off; plain HTTP, as the demo leaves out the report's TLS (tests/quality/security/test_compose.py).
    networks:
      heilig-hart-leuven: {aliases: [heilig-hart-leuven-pages]}
      messaging: {aliases: [heilig-hart-leuven-messaging]}
      final-models: {}

  # TB1 and TB4, AZ Diest.
  az-diest-flower-supernode:
    <<: *supernode
    command:
      - --superlink=flower-superlink:9092
      - --insecure
      - --isolation=process
      - --host=0.0.0.0
      - --port=9094
      - --node-config=data-path='/demo/hospitals/az-diest/cohort'
    networks: [model-updates, az-diest-flower-client-app]

  # The startup's code at the hospital (TB4): only the cohort, read-only, so it
  # writes nothing at the hospital, and a network that reaches nothing but its
  # SuperNode (tests/quality/security/test_running_containers.py).
  az-diest-flower-client-app:
    <<: *superexec
    depends_on: [az-diest-flower-supernode]
    command: [--runtime-api-address=az-diest-flower-supernode:9094, --insecure]
    volumes:
      - {type: volume, source: az-diest, target: /demo/hospitals/az-diest/cohort, read_only: true, volume: {subpath: cohort}}
    networks: [az-diest-flower-client-app]

  az-diest-web:
    <<: *web
    # One container, two servers, each on a name only one network knows: the
    # proxy reaches the pages, the practice only the lab-order endpoint (tests/quality/security/test_running_containers.py).
    # Either one stopping stops the container, and compose restarts it.
    command:
      - bash
      - -c
      - |
        trap 'kill $$(jobs -p)' TERM INT
        gunicorn web.wsgi --bind=az-diest-pages:8000 --workers=2 --access-logfile=- &
        python manage.py serve_messages az-diest-messaging:8441 &
        wait -n
        exit 1
    restart: unless-stopped
    # Ready when both servers answer, each on its own network's name; the pages
    # under a name ALLOWED_HOSTS knows.
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import socket, urllib.request; urllib.request.urlopen(urllib.request.Request('http://az-diest-pages:8000/login/', headers={'Host': 'localhost'}), timeout=5); socket.create_connection(('az-diest-messaging', 8441)).close()"]
    environment:
      PARTY: hospital
      DATA_DIR: /demo/hospitals/az-diest
      PARTY_NAME: AZ Diest
      PARTY_COLOUR: violet
      # The startup's final-models endpoint, and the name the startup issued this
      # hospital (features/hospital/fetch.feature).
      STARTUP_ADDRESS: startup-final-models:8442
      HOSPITAL_CERTIFICATE_NAME: az-diest
    volumes:
      - {type: volume, source: az-diest, target: /demo/hospitals/az-diest}
    # The laboratory director provides the training cohort and fetches final
    # models here, so the web app writes the cohort folder and screening-models,
    # through the hospital's whole volume (features/hospital/training_cohort.feature,
    # features/hospital/fetch.feature); it holds no SuperNode key.
    # DEBUG off; plain HTTP, as the demo leaves out the report's TLS (tests/quality/security/test_compose.py).
    networks:
      az-diest: {aliases: [az-diest-pages]}
      messaging: {aliases: [az-diest-messaging]}
      final-models: {}

  # TB3, each general practitioner's practice, sending samples to every hospital's
  # laboratory (features/practice/messaging.feature): on the messaging network.
  huisartsenpraktijk-de-akker-web:
    <<: *practice-web
    build: {context: .., dockerfile: demo/practice-web.Dockerfile}
    command: [gunicorn, web.wsgi, --bind=0.0.0.0:8000, --workers=2, --access-logfile=-]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/login/', timeout=5)"]
    environment:
      PARTY: practice
      DATA_DIR: /demo/practices/huisartsenpraktijk-de-akker
      PARTY_NAME: Huisartsenpraktijk De Akker
      PRACTICE_CERTIFICATE_NAME: huisartsenpraktijk-de-akker
      PARTY_COLOUR: green
    volumes:
      - {type: volume, source: huisartsenpraktijk-de-akker, target: /demo/practices/huisartsenpraktijk-de-akker}
    networks: [huisartsenpraktijk-de-akker, messaging]

  huisartsenpraktijk-de-berk-web:
    <<: *practice-web
    command: [gunicorn, web.wsgi, --bind=0.0.0.0:8000, --workers=2, --access-logfile=-]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/login/', timeout=5)"]
    environment:
      PARTY: practice
      DATA_DIR: /demo/practices/huisartsenpraktijk-de-berk
      PARTY_NAME: Huisartsenpraktijk De Berk
      PRACTICE_CERTIFICATE_NAME: huisartsenpraktijk-de-berk
      PARTY_COLOUR: amber
    volumes:
      - {type: volume, source: huisartsenpraktijk-de-berk, target: /demo/practices/huisartsenpraktijk-de-berk}
    networks: [huisartsenpraktijk-de-berk, messaging]

  huisartsenpraktijk-de-ceder-web:
    <<: *practice-web
    command: [gunicorn, web.wsgi, --bind=0.0.0.0:8000, --workers=2, --access-logfile=-]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/login/', timeout=5)"]
    environment:
      PARTY: practice
      DATA_DIR: /demo/practices/huisartsenpraktijk-de-ceder
      PARTY_NAME: Huisartsenpraktijk De Ceder
      PRACTICE_CERTIFICATE_NAME: huisartsenpraktijk-de-ceder
      PARTY_COLOUR: purple
    volumes:
      - {type: volume, source: huisartsenpraktijk-de-ceder, target: /demo/practices/huisartsenpraktijk-de-ceder}
    networks: [huisartsenpraktijk-de-ceder, messaging]

  # Between the browser and the parties, like the internet: routes each
  # <party>.localhost by its Host header. The only published port.
  proxy:
    image: nginx:1.28-alpine
    user: *user
    depends_on:
      prepare: {condition: service_completed_successfully}
    ports: ["127.0.0.1:${DEMO_HTTP_PORT:-80}:8080"]
    volumes: ["./proxy.conf:/etc/nginx/nginx.conf:ro"]
    healthcheck:
      <<: *health
      test: [CMD, nc, -z, 127.0.0.1, "8080"]
    networks:
      [startup-web, uz-leuven, heilig-hart-leuven, az-diest,
       huisartsenpraktijk-de-akker, huisartsenpraktijk-de-berk, huisartsenpraktijk-de-ceder]

networks:
  setup: {}
  startup: {internal: true}
  startup-web: {}
  final-models: {internal: true}
  model-updates: {internal: true}
  messaging: {internal: true}
  uz-leuven: {}
  uz-leuven-flower-client-app: {internal: true}
  heilig-hart-leuven: {}
  heilig-hart-leuven-flower-client-app: {internal: true}
  az-diest: {}
  az-diest-flower-client-app: {internal: true}
  huisartsenpraktijk-de-akker: {}
  huisartsenpraktijk-de-berk: {}
  huisartsenpraktijk-de-ceder: {}

# One per party: `docker compose down -v` deletes them all.
volumes:
  startup: {}
  uz-leuven: {}
  heilig-hart-leuven: {}
  az-diest: {}
  huisartsenpraktijk-de-akker: {}
  huisartsenpraktijk-de-berk: {}
  huisartsenpraktijk-de-ceder: {}
