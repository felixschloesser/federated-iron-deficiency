# The demo (demo/README.md): one container per server, and one volume per
# party, of which every container mounts only its own party's parts. Each
# party's setup job, <party>-setup, sets the party up from its own NHANES
# extract before the party's servers start; nhanes-download writes the extracts
# to .demo/ on the host.
#
#   docker compose up --build --abort-on-container-failure
#   docker compose run --rm train
#   docker compose down -v          # start over; .demo/ on the host stays
#
# Browsers reach http://<party>.localhost through the proxy, which has the only
# published port. Every party's servers share one network, internet, as they
# would share the internet: reaching a server grants nothing, so no boundary
# between parties rests on a network (see networks: below). A party's web app
# and its gRPC endpoint are two containers of one image: <party>-web and
# <party>-grpc.
#
# The parties: three hospitals, each paired with the general practitioner's
# practice whose primary laboratory it is (the practices are fictional).
# base.yaml holds what the services share; each party's services here give
# only that party's facts: its name and colour (a Pico theme), its setup job's
# steps (whom it knows, whether its laboratory director provided the training
# cohort), its volume and its networks. nhanes-download's --pair arguments give
# each hospital its NHANES cycle and each practice its number of patients. How a
# hospital trains is the startup's choice, made in its Flower app; nothing in
# this file reaches the FAB.

name: iron-deficiency

# Each image is built once, by the first service that names it
# (nhanes-download, startup-web, the first hospital, flower-server-app, the
# first practice); every other service uses it as built.

services:
  # The one container that reaches the internet: it writes the public NHANES
  # extracts each party seeds from, one folder per party, on the host, and sees
  # no party's volume (demo/nhanes.py). Once they exist it is done in a second.
  # .demo/'s folders come with the checkout, so they are yours: on Linux, where
  # a bind mount keeps numeric IDs, set DEMO_USER=$(id -u):$(id -g) in .env if
  # your account is not 1000:1000.
  nhanes-download:
    image: ${COMPOSE_PROJECT_NAME}-nhanes-download
    build: {context: .., dockerfile: demo/nhanes-download.Dockerfile}
    user: ${DEMO_USER:-1000:1000}
    # Each hospital and its practice: cycle, folder names, the practice's patients.
    command: [python, -m, demo.nhanes, --out-dir, /demo/nhanes, --pair, 2005-2006, uz-leuven, huisartsenpraktijk-de-akker, "40", --pair, 2015-2016, heilig-hart-leuven, huisartsenpraktijk-de-berk, "24", --pair, 2017-2018, az-diest, huisartsenpraktijk-de-ceder, "12"]
    environment:
      # Hugging Face may refuse unauthenticated downloads of the NHANES data.
      HF_TOKEN: ${HF_TOKEN:-}
      # Downloads and extracts stay on the host, so `down -v` fetches nothing again.
      HF_HOME: /demo/huggingface
    volumes:
      - ../.demo/huggingface:/demo/huggingface
      - ../.demo/nhanes:/demo/nhanes
    networks: [setup]

  # The startup.
  flower-superlink:
    extends: {file: base.yaml, service: server}
    image: flwr/superlink:1.40.0
    environment:
      FLWR_HOME: /tmp/flwr
    # Its folder is the startup's, whose setup job brings it (demo/startup.Dockerfile).
    depends_on:
      startup-setup: {condition: service_completed_successfully}
    command:
      - --host=0.0.0.0
      - --port=9092
      - --database=/demo/startup/superlink/state.db
      - --isolation=process
      # Plaintext, and any SuperNode may connect: the demo leaves out TLS and
      # SuperNode authentication for simplicity.
      - --insecure
    volumes:
      - {type: volume, source: startup, target: /demo/startup/superlink, volume: {subpath: superlink}}
    networks: [internet]
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('localhost', 9092)).close()"]

  flower-server-app:
    extends: {file: base.yaml, service: superexec}
    build: {context: .., dockerfile: demo/superexec.Dockerfile}
    depends_on:
      flower-superlink: {condition: service_healthy}
    command:
      - --runtime-api-address=flower-superlink:9092
      - --insecure
    # Where the ServerApp keeps final models: the startup's folder, at the path
    # its web app reads it.
    environment:
      FINAL_MODELS_DIR: /data/final-models
    volumes:
      - {type: volume, source: startup, target: /data/final-models, volume: {subpath: final-models}}
    networks: [internet]

  # The data scientist submits a training run from inside the startup:
  # `docker compose run --rm train`.
  train:
    image: ${COMPOSE_PROJECT_NAME}-startup-web
    user: "1000:1000"
    profiles: [train]
    depends_on:
      flower-superlink: {condition: service_healthy}
    command: [flwr, run, /app, demo, --stream]
    # Its SuperLink connection, flwr-home/config.toml, comes with the startup's image.
    environment:
      FLWR_HOME: /demo/startup/flwr-home
    volumes:
      - {type: volume, source: startup, target: /demo/startup/flwr-home, volume: {subpath: flwr-home}}
    networks: [internet]

  # Its data scientist, and every hospital as a recipient of released final models.
  startup-setup:
    extends: {file: base.yaml, service: startup-setup}
    command:
      - sh
      - -c
      - >-
        python manage.py migrate -v0
        && python -m demo.seed startup
        && python manage.py add_hospital 'UZ Leuven'
        && python manage.py add_hospital 'Heilig Hart Leuven'
        && python manage.py add_hospital 'AZ Diest'
    volumes:
      - {type: volume, source: startup, target: /data}

  # The startup's web app: its data scientist sees the final models, submits
  # training runs and releases final models.
  startup-web:
    extends: {file: base.yaml, service: web}
    image: ${COMPOSE_PROJECT_NAME}-startup-web
    build: {context: .., dockerfile: demo/startup.Dockerfile}
    depends_on:
      startup-setup: {condition: service_completed_successfully}
    environment:
      DJANGO_SETTINGS_MODULE: web.startup.settings
      DATA_DIR: /data
      FLWR_HOME: /data/flwr-home
    # The startup's volume, with the final models read-only and the SuperLink's
    # state hidden under a tmpfs, because it belongs to the SuperLink alone. The
    # screening-models endpoint mounts it the same way.
    volumes:
      - {type: volume, source: startup, target: /data}
      - {type: volume, source: startup, target: /data/final-models, read_only: true, volume: {subpath: final-models}}
    tmpfs: [/data/superlink]
    networks: [internet]

  # The startup's screening-models endpoint, from which the hospitals' web apps
  # fetch released final models as screening models.
  startup-grpc:
    extends: {file: base.yaml, service: server}
    image: ${COMPOSE_PROJECT_NAME}-startup-web
    command: [python, manage.py, grpcrunserver, 0.0.0.0:8442]
    environment:
      DJANGO_SETTINGS_MODULE: web.startup.settings
      DATA_DIR: /data
    volumes:
      - {type: volume, source: startup, target: /data}
      - {type: volume, source: startup, target: /data/final-models, read_only: true, volume: {subpath: final-models}}
    tmpfs: [/data/superlink]
    depends_on:
      startup-setup: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('localhost', 8442)).close()"]
    networks: [internet]

  # The hospital UZ Leuven, starting with its SuperNode and ClientApp.
  uz-leuven-flower-supernode:
    extends: {file: base.yaml, service: supernode}
    command:
      - --superlink=flower-superlink:9092
      - --insecure
      - --isolation=process
      - --host=0.0.0.0
      - --port=9094
      - --node-config=data-path='/demo/hospitals/uz-leuven/cohort'
    networks: [internet, uz-leuven-flower-client-app]

  uz-leuven-flower-client-app:
    extends: {file: base.yaml, service: superexec}
    depends_on:
      uz-leuven-flower-supernode: {condition: service_healthy}
      uz-leuven-setup: {condition: service_completed_successfully}
    command: [--runtime-api-address=uz-leuven-flower-supernode:9094, --insecure]
    volumes:
      - {type: volume, source: uz-leuven, target: /demo/hospitals/uz-leuven/cohort, read_only: true, volume: {subpath: cohort}}
    networks: [uz-leuven-flower-client-app]

  # Seeded, with every practice registered by its name; its laboratory
  # director provided the training cohort at start.
  uz-leuven-setup:
    extends: {file: base.yaml, service: hospital-setup}
    command:
      - sh
      - -c
      - >-
        python manage.py migrate -v0
        && python -m demo.seed hospital --rows /nhanes/participants.csv
        --lab-records /nhanes/lab-records.csv --provide
        && python manage.py add_practice 'Huisartsenpraktijk De Akker'
        && python manage.py add_practice 'Huisartsenpraktijk De Berk'
        && python manage.py add_practice 'Huisartsenpraktijk De Ceder'
    volumes:
      - {type: volume, source: uz-leuven, target: /data}
      - ../.demo/nhanes/uz-leuven:/nhanes:ro

  uz-leuven-web:
    extends: {file: base.yaml, service: hospital-web}
    depends_on:
      uz-leuven-setup: {condition: service_completed_successfully}
    build: {context: .., dockerfile: demo/hospital.Dockerfile}
    environment:
      # Its name: shown on its pages, and what it calls the startup as.
      PARTY_NAME: UZ Leuven
      PRIMARY_COLOUR: jade
    volumes:
      - {type: volume, source: uz-leuven, target: /data}
    networks: [internet]

  uz-leuven-grpc:
    extends: {file: base.yaml, service: hospital-grpc}
    depends_on:
      uz-leuven-setup: {condition: service_completed_successfully}
    volumes:
      - {type: volume, source: uz-leuven, target: /data}

  # The hospital Heilig Hart Leuven, starting with its SuperNode and ClientApp.
  heilig-hart-leuven-flower-supernode:
    extends: {file: base.yaml, service: supernode}
    command:
      - --superlink=flower-superlink:9092
      - --insecure
      - --isolation=process
      - --host=0.0.0.0
      - --port=9094
      - --node-config=data-path='/demo/hospitals/heilig-hart-leuven/cohort'
    networks: [internet, heilig-hart-leuven-flower-client-app]

  heilig-hart-leuven-flower-client-app:
    extends: {file: base.yaml, service: superexec}
    depends_on:
      heilig-hart-leuven-flower-supernode: {condition: service_healthy}
      heilig-hart-leuven-setup: {condition: service_completed_successfully}
    command: [--runtime-api-address=heilig-hart-leuven-flower-supernode:9094, --insecure]
    volumes:
      - {type: volume, source: heilig-hart-leuven, target: /demo/hospitals/heilig-hart-leuven/cohort, read_only: true, volume: {subpath: cohort}}
    networks: [heilig-hart-leuven-flower-client-app]

  # Seeded, with every practice registered by its name; its laboratory
  # director provided the training cohort at start.
  heilig-hart-leuven-setup:
    extends: {file: base.yaml, service: hospital-setup}
    command:
      - sh
      - -c
      - >-
        python manage.py migrate -v0
        && python -m demo.seed hospital --rows /nhanes/participants.csv
        --lab-records /nhanes/lab-records.csv --provide
        && python manage.py add_practice 'Huisartsenpraktijk De Akker'
        && python manage.py add_practice 'Huisartsenpraktijk De Berk'
        && python manage.py add_practice 'Huisartsenpraktijk De Ceder'
    volumes:
      - {type: volume, source: heilig-hart-leuven, target: /data}
      - ../.demo/nhanes/heilig-hart-leuven:/nhanes:ro

  heilig-hart-leuven-web:
    extends: {file: base.yaml, service: hospital-web}
    depends_on:
      heilig-hart-leuven-setup: {condition: service_completed_successfully}
    environment:
      # Its name: shown on its pages, and what it calls the startup as.
      PARTY_NAME: Heilig Hart Leuven
      PRIMARY_COLOUR: pumpkin
    volumes:
      - {type: volume, source: heilig-hart-leuven, target: /data}
    networks: [internet]

  heilig-hart-leuven-grpc:
    extends: {file: base.yaml, service: hospital-grpc}
    depends_on:
      heilig-hart-leuven-setup: {condition: service_completed_successfully}
    volumes:
      - {type: volume, source: heilig-hart-leuven, target: /data}

  # The hospital AZ Diest, starting with its SuperNode and ClientApp.
  az-diest-flower-supernode:
    extends: {file: base.yaml, service: supernode}
    command:
      - --superlink=flower-superlink:9092
      - --insecure
      - --isolation=process
      - --host=0.0.0.0
      - --port=9094
      - --node-config=data-path='/demo/hospitals/az-diest/cohort'
    networks: [internet, az-diest-flower-client-app]

  az-diest-flower-client-app:
    extends: {file: base.yaml, service: superexec}
    depends_on:
      az-diest-flower-supernode: {condition: service_healthy}
      az-diest-setup: {condition: service_completed_successfully}
    command: [--runtime-api-address=az-diest-flower-supernode:9094, --insecure]
    volumes:
      - {type: volume, source: az-diest, target: /demo/hospitals/az-diest/cohort, read_only: true, volume: {subpath: cohort}}
    networks: [az-diest-flower-client-app]

  # Seeded, with every practice registered by its name; its laboratory
  # director has not provided the training cohort yet.
  az-diest-setup:
    extends: {file: base.yaml, service: hospital-setup}
    command:
      - sh
      - -c
      - >-
        python manage.py migrate -v0
        && python -m demo.seed hospital --rows /nhanes/participants.csv
        --lab-records /nhanes/lab-records.csv
        && python manage.py add_practice 'Huisartsenpraktijk De Akker'
        && python manage.py add_practice 'Huisartsenpraktijk De Berk'
        && python manage.py add_practice 'Huisartsenpraktijk De Ceder'
    volumes:
      - {type: volume, source: az-diest, target: /data}
      - ../.demo/nhanes/az-diest:/nhanes:ro

  az-diest-web:
    extends: {file: base.yaml, service: hospital-web}
    depends_on:
      az-diest-setup: {condition: service_completed_successfully}
    environment:
      # Its name: shown on its pages, and what it calls the startup as.
      PARTY_NAME: AZ Diest
      PRIMARY_COLOUR: violet
    volumes:
      - {type: volume, source: az-diest, target: /data}
    networks: [internet]

  az-diest-grpc:
    extends: {file: base.yaml, service: hospital-grpc}
    depends_on:
      az-diest-setup: {condition: service_completed_successfully}
    volumes:
      - {type: volume, source: az-diest, target: /data}

  # The practices. Each general practitioner's practice can send samples to
  # every hospital's laboratory; its paired hospital's laboratory is its
  # primary laboratory.
  huisartsenpraktijk-de-akker-setup:
    extends: {file: base.yaml, service: practice-setup}
    command:
      - sh
      - -c
      - >-
        python manage.py migrate -v0
        && python -m demo.seed practice --sample-ids /nhanes/sample-ids.csv --patients /nhanes/patients.csv
        && python manage.py add_laboratory 'UZ Leuven' uz-leuven-grpc:8441 --primary
        && python manage.py add_laboratory 'Heilig Hart Leuven' heilig-hart-leuven-grpc:8441
        && python manage.py add_laboratory 'AZ Diest' az-diest-grpc:8441
    volumes:
      - {type: volume, source: huisartsenpraktijk-de-akker, target: /data}
      - ../.demo/nhanes/huisartsenpraktijk-de-akker:/nhanes:ro

  huisartsenpraktijk-de-akker-web:
    extends: {file: base.yaml, service: practice-web}
    depends_on:
      huisartsenpraktijk-de-akker-setup: {condition: service_completed_successfully}
    build: {context: .., dockerfile: demo/practice.Dockerfile}
    environment:
      # Its name: shown on its pages, and what it calls each hospital as.
      PARTY_NAME: Huisartsenpraktijk De Akker
      PRIMARY_COLOUR: green
    volumes:
      - {type: volume, source: huisartsenpraktijk-de-akker, target: /data}
    networks: [internet]

  huisartsenpraktijk-de-berk-setup:
    extends: {file: base.yaml, service: practice-setup}
    command:
      - sh
      - -c
      - >-
        python manage.py migrate -v0
        && python -m demo.seed practice --sample-ids /nhanes/sample-ids.csv --patients /nhanes/patients.csv
        && python manage.py add_laboratory 'UZ Leuven' uz-leuven-grpc:8441
        && python manage.py add_laboratory 'Heilig Hart Leuven' heilig-hart-leuven-grpc:8441 --primary
        && python manage.py add_laboratory 'AZ Diest' az-diest-grpc:8441
    volumes:
      - {type: volume, source: huisartsenpraktijk-de-berk, target: /data}
      - ../.demo/nhanes/huisartsenpraktijk-de-berk:/nhanes:ro

  huisartsenpraktijk-de-berk-web:
    extends: {file: base.yaml, service: practice-web}
    depends_on:
      huisartsenpraktijk-de-berk-setup: {condition: service_completed_successfully}
    environment:
      # Its name: shown on its pages, and what it calls each hospital as.
      PARTY_NAME: Huisartsenpraktijk De Berk
      PRIMARY_COLOUR: amber
    volumes:
      - {type: volume, source: huisartsenpraktijk-de-berk, target: /data}
    networks: [internet]

  huisartsenpraktijk-de-ceder-setup:
    extends: {file: base.yaml, service: practice-setup}
    command:
      - sh
      - -c
      - >-
        python manage.py migrate -v0
        && python -m demo.seed practice --sample-ids /nhanes/sample-ids.csv --patients /nhanes/patients.csv
        && python manage.py add_laboratory 'UZ Leuven' uz-leuven-grpc:8441
        && python manage.py add_laboratory 'Heilig Hart Leuven' heilig-hart-leuven-grpc:8441
        && python manage.py add_laboratory 'AZ Diest' az-diest-grpc:8441 --primary
    volumes:
      - {type: volume, source: huisartsenpraktijk-de-ceder, target: /data}
      - ../.demo/nhanes/huisartsenpraktijk-de-ceder:/nhanes:ro

  huisartsenpraktijk-de-ceder-web:
    extends: {file: base.yaml, service: practice-web}
    depends_on:
      huisartsenpraktijk-de-ceder-setup: {condition: service_completed_successfully}
    environment:
      # Its name: shown on its pages, and what it calls each hospital as.
      PARTY_NAME: Huisartsenpraktijk De Ceder
      PRIMARY_COLOUR: purple
    volumes:
      - {type: volume, source: huisartsenpraktijk-de-ceder, target: /data}
    networks: [internet]

  # Between the browser and the parties, like the internet: routes each
  # <party>.localhost to <party>-web by its Host header (proxy.conf). The only
  # published port; up once every web app answers, so a browser never sees a
  # party that is still setting itself up.
  proxy:
    extends: {file: base.yaml, service: server}
    image: nginx:1.28-alpine
    depends_on:
      startup-web: {condition: service_healthy}
      uz-leuven-web: {condition: service_healthy}
      heilig-hart-leuven-web: {condition: service_healthy}
      az-diest-web: {condition: service_healthy}
      huisartsenpraktijk-de-akker-web: {condition: service_healthy}
      huisartsenpraktijk-de-berk-web: {condition: service_healthy}
      huisartsenpraktijk-de-ceder-web: {condition: service_healthy}
    ports: ["127.0.0.1:${DEMO_HTTP_PORT:-80}:8080"]
    volumes: ["./proxy.conf:/etc/nginx/nginx.conf:ro"]
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "8080"]
    networks: [internet, browser]

networks:
  # nhanes-download's way out to the real internet.
  setup: {}
  # Every party's servers, like the internet between them: reaching a server
  # grants nothing, as each call must say who it is from (the report's mutual
  # TLS; the demo's caller slug). Internal: no way out to the real internet.
  internet: {internal: true}
  # The proxy's published port; an internal network can publish none.
  browser: {}
  # The startup's code at each hospital reaches only its SuperNode.
  uz-leuven-flower-client-app: {internal: true}
  heilig-hart-leuven-flower-client-app: {internal: true}
  az-diest-flower-client-app: {internal: true}

# One per party: `docker compose down -v` deletes them all.
volumes:
  startup: {}
  uz-leuven: {}
  heilig-hart-leuven: {}
  az-diest: {}
  huisartsenpraktijk-de-akker: {}
  huisartsenpraktijk-de-berk: {}
  huisartsenpraktijk-de-ceder: {}
