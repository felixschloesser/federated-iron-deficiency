# The demo (demo/README.md): one container per server, one network per
# trust boundary of the report's DFDs, and one per crossing, and one volume
# per party: every container mounts only its own party's parts of it. Each
# party's web app sets the party up when it starts (demo/party.py), from its
# own NHANES extract, which nhanes-download writes to .demo/ on the host.
#
#   docker compose up --build --abort-on-container-failure
#   docker compose run --rm train
#   docker compose down -v          # start over; .demo/ on the host stays
#
# Browsers reach http://<party>.localhost through the proxy, the only
# published port. Networks: startup (TB2), startup-web (the startup's web app
# and the proxy), <hospital> (TB1), <hospital>-flower-client-app (TB4,
# internal), <practice> (TB3); model-updates crosses TB2-TB1 (DF7-DF10),
# lab-orders crosses TB3-TB1 (DF23, DF25): every practice reaches every
# hospital's lab-order endpoint, <hospital>-grpc, there; final-models joins
# the hospitals' web apps and the startup's final-models endpoint,
# startup-grpc. A party's web app and its gRPC endpoint are two containers of
# one image: <party>-web and <party>-grpc.
#
# The parties: three hospitals, each with the general practitioner's practice
# whose primary laboratory it is (the practices are fictional). Each kind of
# service runs as kinds.yaml says; each party's services say only its
# facts: its name and colour (a Pico theme), whom it knows (DEMO_REGISTER),
# whether its laboratory director provided the training cohort (DEMO_PROVIDE),
# its volume and its networks. nhanes-download's --pair arguments give each
# hospital its NHANES cycle and its practice its number of patients. How a
# hospital trains is the startup's choice, in its app; this file never reaches
# the FAB.

name: iron-deficiency

# Each image is built once, by the first service that names it
# (nhanes-download, startup-web, the first hospital, flower-server-app, the
# first practice); every other service uses it as built.

services:
  # The one container that reaches the internet: it writes the public NHANES
  # extracts each party seeds from, one folder per party, on the host, and sees
  # no party's volume (demo/nhanes.py). Once they exist it is done in a second.
  # .demo/'s folders come with the checkout, so they are yours: on Linux, where
  # a bind mount keeps numeric IDs, set DEMO_USER=$(id -u):$(id -g) in .env if
  # your account is not 1000:1000.
  nhanes-download:
    image: ${COMPOSE_PROJECT_NAME}-nhanes-download
    build: {context: .., dockerfile: demo/nhanes-download.Dockerfile}
    user: ${DEMO_USER:-1000:1000}
    # Each hospital and its practice: cycle, folder names, the practice's patients.
    command: [python, -m, demo.nhanes, --out-dir, /demo/nhanes, --pair, 2005-2006, uz-leuven, huisartsenpraktijk-de-akker, "40", --pair, 2015-2016, heilig-hart-leuven, huisartsenpraktijk-de-berk, "24", --pair, 2017-2018, az-diest, huisartsenpraktijk-de-ceder, "12"]
    environment:
      # Hugging Face may refuse unauthenticated downloads of the NHANES data.
      HF_TOKEN: ${HF_TOKEN:-}
      # Downloads and extracts stay on the host, so `down -v` fetches nothing again.
      HF_HOME: /demo/huggingface
    volumes:
      - ../.demo/huggingface:/demo/huggingface
      - ../.demo/nhanes:/demo/nhanes
    networks: [setup]

  # TB2, the startup.
  flower-superlink:
    extends: {file: kinds.yaml, service: server}
    image: flwr/superlink:1.40.0
    environment:
      FLWR_HOME: /tmp/flwr
    # Its folder is the startup's, whose web app brings it (demo/startup.Dockerfile).
    depends_on:
      startup-web: {condition: service_healthy}
    command:
      - --host=0.0.0.0
      - --port=9092
      - --database=/demo/startup/superlink/state.db
      - --isolation=process
      # Plaintext, any node admitted: the report's TLS and SuperNode
      # authentication are left out of the demo for simplicity.
      - --insecure
    volumes:
      - {type: volume, source: startup, target: /demo/startup/superlink, volume: {subpath: superlink}}
    networks: [startup, model-updates]
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('localhost', 9092)).close()"]

  flower-server-app:
    extends: {file: kinds.yaml, service: superexec}
    build: {context: .., dockerfile: demo/superexec.Dockerfile}
    depends_on:
      flower-superlink: {condition: service_healthy}
    command:
      - --runtime-api-address=flower-superlink:9092
      - --insecure
    volumes:
      - {type: volume, source: startup, target: /demo/startup/final-models, volume: {subpath: final-models}}
    networks: [startup]

  # E1, the data scientist, submits from inside TB2: `docker compose run --rm train`.
  train:
    image: ${COMPOSE_PROJECT_NAME}-startup-web
    user: "1000:1000"
    profiles: [train]
    depends_on:
      flower-superlink: {condition: service_healthy}
    # Not the web app's start (demo/party.py): the data scientist's command line.
    entrypoint: []
    command: [flwr, run, /app, demo, --run-config, "demo-dir='/demo'", --stream]
    # The startup's web app writes flwr-home/config.toml when it starts.
    environment:
      FLWR_HOME: /demo/startup/flwr-home
    volumes:
      - {type: volume, source: startup, target: /demo/startup/flwr-home, volume: {subpath: flwr-home}}
    networks: [startup]

  # The startup's web app: its data scientist sees the final models, submits
  # training runs and releases final models. On the startup network to reach
  # the SuperLink, which neither the proxy nor a hospital reaches.
  startup-web:
    extends: {file: kinds.yaml, service: web}
    image: ${COMPOSE_PROJECT_NAME}-startup-web
    build: {context: .., dockerfile: demo/startup.Dockerfile}
    environment:
      DJANGO_SETTINGS_MODULE: web.startup.settings
      DATA_DIR: /data
      FLWR_HOME: /data/flwr-home
      DEMO_ADDRESS: http://startup.localhost:${DEMO_HTTP_PORT:-80}
      # Every hospital, as a recipient of released final models.
      DEMO_REGISTER: |
        add_hospital 'UZ Leuven'
        add_hospital 'Heilig Hart Leuven'
        add_hospital 'AZ Diest'
    # The startup's volume: the final models read-only, the SuperLink's state
    # masked, as it is the SuperLink's alone. The final-models endpoint sees it
    # alike.
    volumes:
      - {type: volume, source: startup, target: /data}
      - {type: volume, source: startup, target: /data/final-models, read_only: true, volume: {subpath: final-models}}
    tmpfs: [/data/superlink]
    networks: [startup, startup-web]

  # The startup's final-models endpoint (P5), the only thing the hospitals'
  # web apps reach at the startup.
  startup-grpc:
    extends: {file: kinds.yaml, service: endpoint}
    image: ${COMPOSE_PROJECT_NAME}-startup-web
    command: [python, manage.py, grpcrunserver, 0.0.0.0:8442]
    environment:
      DJANGO_SETTINGS_MODULE: web.startup.settings
      DATA_DIR: /data
    volumes:
      - {type: volume, source: startup, target: /data}
      - {type: volume, source: startup, target: /data/final-models, read_only: true, volume: {subpath: final-models}}
    tmpfs: [/data/superlink]
    depends_on:
      startup-web: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('localhost', 8442)).close()"]
    networks: [final-models]

  # TB1 and TB4, UZ Leuven.
  uz-leuven-flower-supernode:
    extends: {file: kinds.yaml, service: supernode}
    command:
      - --superlink=flower-superlink:9092
      - --insecure
      - --isolation=process
      - --host=0.0.0.0
      - --port=9094
      - --node-config=data-path='/demo/hospitals/uz-leuven/cohort'
    networks: [model-updates, uz-leuven-flower-client-app]

  uz-leuven-flower-client-app:
    extends: {file: kinds.yaml, service: superexec}
    depends_on:
      uz-leuven-flower-supernode: {condition: service_healthy}
      uz-leuven-web: {condition: service_healthy}
    command: [--runtime-api-address=uz-leuven-flower-supernode:9094, --insecure]
    volumes:
      - {type: volume, source: uz-leuven, target: /demo/hospitals/uz-leuven/cohort, read_only: true, volume: {subpath: cohort}}
    networks: [uz-leuven-flower-client-app]

  uz-leuven-web:
    extends: {file: kinds.yaml, service: hospital-web}
    build: {context: .., dockerfile: demo/hospital.Dockerfile}
    environment:
      DEMO_ADDRESS: http://uz-leuven.localhost:${DEMO_HTTP_PORT:-80}
      # Its laboratory director provided the training cohort at start.
      DEMO_PROVIDE: "1"
      # Its name: shown on its pages, and what it calls the startup as.
      HOSPITAL_NAME: UZ Leuven
      PRIMARY_COLOUR: jade
    volumes:
      - {type: volume, source: uz-leuven, target: /data}
      - ../.demo/nhanes/uz-leuven:/nhanes:ro
    networks: [uz-leuven, final-models]

  uz-leuven-grpc:
    extends: {file: kinds.yaml, service: hospital-grpc}
    depends_on:
      uz-leuven-web: {condition: service_healthy}
    volumes:
      - {type: volume, source: uz-leuven, target: /data}

  # TB1 and TB4, Heilig Hart Leuven.
  heilig-hart-leuven-flower-supernode:
    extends: {file: kinds.yaml, service: supernode}
    command:
      - --superlink=flower-superlink:9092
      - --insecure
      - --isolation=process
      - --host=0.0.0.0
      - --port=9094
      - --node-config=data-path='/demo/hospitals/heilig-hart-leuven/cohort'
    networks: [model-updates, heilig-hart-leuven-flower-client-app]

  heilig-hart-leuven-flower-client-app:
    extends: {file: kinds.yaml, service: superexec}
    depends_on:
      heilig-hart-leuven-flower-supernode: {condition: service_healthy}
      heilig-hart-leuven-web: {condition: service_healthy}
    command: [--runtime-api-address=heilig-hart-leuven-flower-supernode:9094, --insecure]
    volumes:
      - {type: volume, source: heilig-hart-leuven, target: /demo/hospitals/heilig-hart-leuven/cohort, read_only: true, volume: {subpath: cohort}}
    networks: [heilig-hart-leuven-flower-client-app]

  heilig-hart-leuven-web:
    extends: {file: kinds.yaml, service: hospital-web}
    environment:
      DEMO_ADDRESS: http://heilig-hart-leuven.localhost:${DEMO_HTTP_PORT:-80}
      # Its laboratory director provided the training cohort at start.
      DEMO_PROVIDE: "1"
      # Its name: shown on its pages, and what it calls the startup as.
      HOSPITAL_NAME: Heilig Hart Leuven
      PRIMARY_COLOUR: pumpkin
    volumes:
      - {type: volume, source: heilig-hart-leuven, target: /data}
      - ../.demo/nhanes/heilig-hart-leuven:/nhanes:ro
    networks: [heilig-hart-leuven, final-models]

  heilig-hart-leuven-grpc:
    extends: {file: kinds.yaml, service: hospital-grpc}
    depends_on:
      heilig-hart-leuven-web: {condition: service_healthy}
    volumes:
      - {type: volume, source: heilig-hart-leuven, target: /data}

  # TB1 and TB4, AZ Diest.
  az-diest-flower-supernode:
    extends: {file: kinds.yaml, service: supernode}
    command:
      - --superlink=flower-superlink:9092
      - --insecure
      - --isolation=process
      - --host=0.0.0.0
      - --port=9094
      - --node-config=data-path='/demo/hospitals/az-diest/cohort'
    networks: [model-updates, az-diest-flower-client-app]

  az-diest-flower-client-app:
    extends: {file: kinds.yaml, service: superexec}
    depends_on:
      az-diest-flower-supernode: {condition: service_healthy}
      az-diest-web: {condition: service_healthy}
    command: [--runtime-api-address=az-diest-flower-supernode:9094, --insecure]
    volumes:
      - {type: volume, source: az-diest, target: /demo/hospitals/az-diest/cohort, read_only: true, volume: {subpath: cohort}}
    networks: [az-diest-flower-client-app]

  az-diest-web:
    extends: {file: kinds.yaml, service: hospital-web}
    environment:
      DEMO_ADDRESS: http://az-diest.localhost:${DEMO_HTTP_PORT:-80}
      # Its name: shown on its pages, and what it calls the startup as.
      HOSPITAL_NAME: AZ Diest
      PRIMARY_COLOUR: violet
    volumes:
      - {type: volume, source: az-diest, target: /data}
      - ../.demo/nhanes/az-diest:/nhanes:ro
    networks: [az-diest, final-models]

  az-diest-grpc:
    extends: {file: kinds.yaml, service: hospital-grpc}
    depends_on:
      az-diest-web: {condition: service_healthy}
    volumes:
      - {type: volume, source: az-diest, target: /data}

  # TB3, each general practitioner's practice, sending samples to every hospital's
  # laboratory: on the lab-orders network.
  huisartsenpraktijk-de-akker-web:
    extends: {file: kinds.yaml, service: practice-web}
    build: {context: .., dockerfile: demo/practice.Dockerfile}
    environment:
      DEMO_ADDRESS: http://huisartsenpraktijk-de-akker.localhost:${DEMO_HTTP_PORT:-80}
      # Every hospital's laboratory; its paired hospital's is the primary one.
      DEMO_REGISTER: |
        add_laboratory 'UZ Leuven' uz-leuven-grpc:8441 --primary
        add_laboratory 'Heilig Hart Leuven' heilig-hart-leuven-grpc:8441
        add_laboratory 'AZ Diest' az-diest-grpc:8441
      # Its name: shown on its pages, and what it calls each hospital as.
      PRACTICE_NAME: Huisartsenpraktijk De Akker
      PRIMARY_COLOUR: green
    volumes:
      - {type: volume, source: huisartsenpraktijk-de-akker, target: /data}
      - ../.demo/nhanes/huisartsenpraktijk-de-akker:/nhanes:ro
    networks: [huisartsenpraktijk-de-akker, lab-orders]

  huisartsenpraktijk-de-berk-web:
    extends: {file: kinds.yaml, service: practice-web}
    environment:
      DEMO_ADDRESS: http://huisartsenpraktijk-de-berk.localhost:${DEMO_HTTP_PORT:-80}
      # Every hospital's laboratory; its paired hospital's is the primary one.
      DEMO_REGISTER: |
        add_laboratory 'UZ Leuven' uz-leuven-grpc:8441
        add_laboratory 'Heilig Hart Leuven' heilig-hart-leuven-grpc:8441 --primary
        add_laboratory 'AZ Diest' az-diest-grpc:8441
      # Its name: shown on its pages, and what it calls each hospital as.
      PRACTICE_NAME: Huisartsenpraktijk De Berk
      PRIMARY_COLOUR: amber
    volumes:
      - {type: volume, source: huisartsenpraktijk-de-berk, target: /data}
      - ../.demo/nhanes/huisartsenpraktijk-de-berk:/nhanes:ro
    networks: [huisartsenpraktijk-de-berk, lab-orders]

  huisartsenpraktijk-de-ceder-web:
    extends: {file: kinds.yaml, service: practice-web}
    environment:
      DEMO_ADDRESS: http://huisartsenpraktijk-de-ceder.localhost:${DEMO_HTTP_PORT:-80}
      # Every hospital's laboratory; its paired hospital's is the primary one.
      DEMO_REGISTER: |
        add_laboratory 'UZ Leuven' uz-leuven-grpc:8441
        add_laboratory 'Heilig Hart Leuven' heilig-hart-leuven-grpc:8441
        add_laboratory 'AZ Diest' az-diest-grpc:8441 --primary
      # Its name: shown on its pages, and what it calls each hospital as.
      PRACTICE_NAME: Huisartsenpraktijk De Ceder
      PRIMARY_COLOUR: purple
    volumes:
      - {type: volume, source: huisartsenpraktijk-de-ceder, target: /data}
      - ../.demo/nhanes/huisartsenpraktijk-de-ceder:/nhanes:ro
    networks: [huisartsenpraktijk-de-ceder, lab-orders]

  # Between the browser and the parties, like the internet: routes each
  # <party>.localhost to <party>-web by its Host header (proxy.conf). The only
  # published port; up once every web app answers, so a browser never sees a
  # party that is still setting itself up.
  proxy:
    extends: {file: kinds.yaml, service: server}
    image: nginx:1.28-alpine
    depends_on:
      startup-web: {condition: service_healthy}
      uz-leuven-web: {condition: service_healthy}
      heilig-hart-leuven-web: {condition: service_healthy}
      az-diest-web: {condition: service_healthy}
      huisartsenpraktijk-de-akker-web: {condition: service_healthy}
      huisartsenpraktijk-de-berk-web: {condition: service_healthy}
      huisartsenpraktijk-de-ceder-web: {condition: service_healthy}
    ports: ["127.0.0.1:${DEMO_HTTP_PORT:-80}:8080"]
    volumes: ["./proxy.conf:/etc/nginx/nginx.conf:ro"]
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "8080"]
    networks:
      [startup-web, uz-leuven, heilig-hart-leuven, az-diest,
       huisartsenpraktijk-de-akker, huisartsenpraktijk-de-berk, huisartsenpraktijk-de-ceder]

networks:
  setup: {}
  startup: {internal: true}
  startup-web: {}
  final-models: {internal: true}
  model-updates: {internal: true}
  lab-orders: {internal: true}
  uz-leuven: {}
  uz-leuven-flower-client-app: {internal: true}
  heilig-hart-leuven: {}
  heilig-hart-leuven-flower-client-app: {internal: true}
  az-diest: {}
  az-diest-flower-client-app: {internal: true}
  huisartsenpraktijk-de-akker: {}
  huisartsenpraktijk-de-berk: {}
  huisartsenpraktijk-de-ceder: {}

# One per party: `docker compose down -v` deletes them all.
volumes:
  startup: {}
  uz-leuven: {}
  heilig-hart-leuven: {}
  az-diest: {}
  huisartsenpraktijk-de-akker: {}
  huisartsenpraktijk-de-berk: {}
  huisartsenpraktijk-de-ceder: {}
