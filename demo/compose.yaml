# The demo (demo/README.md): one container per service, one network per
# trust boundary of the report's DFDs, and one per crossing, and one volume
# per party: every container mounts only its own party's parts of it. Each
# party's web app sets itself up when it starts (demo/party.py), from its own
# NHANES extract, which nhanes-download writes to .demo/ on the host.
#
#   docker compose up --build --abort-on-container-failure
#   docker compose run --rm train
#   docker compose down -v          # start over; .demo/ on the host stays
#
# Browsers reach http://<party>.localhost through the proxy, the only
# published port. Networks: startup (TB2), startup-web (the startup's web app
# and the proxy), <hospital> (TB1), <hospital>-flower-client-app (TB4,
# internal), <practice> (TB3); model-updates crosses TB2-TB1 (DF7-DF10),
# messaging crosses TB3-TB1 (DF23, DF25): every practice reaches every
# hospital's endpoint there, by the alias <hospital>-messaging.
#
# The parties: three hospitals, each with the general practitioner's practice
# whose primary laboratory it is (the practices are fictional). Each party's
# facts sit in its own services: its name and colour (a Pico theme), whom it
# knows (DEMO_REGISTER), whether its laboratory director provided the training
# cohort (DEMO_PROVIDE); nhanes-download's --pair arguments give each hospital
# its NHANES cycle and its practice its number of patients. How a hospital
# trains is the startup's choice, in its app; this file never reaches the FAB.

name: iron-deficiency

# Each image is built once, by the first service that names it
# (nhanes-download, startup-web, the first hospital, flower-server-app, the
# first practice); every other service uses it as built.
# Every container that touches a party's volume runs as our images' app user,
# who owns the folders each image brings: Docker copies them into a fresh
# volume, so no container needs root to hand a volume over.
x-user: &user "1000:1000"
# nhanes-download writes to .demo/ on the host, where, on Linux, a bind mount
# keeps numeric IDs: set DEMO_USER=$(id -u):$(id -g) in .env if your account is
# not 1000:1000.
x-demo-user: &demo-user "${DEMO_USER:-1000:1000}"

# Checked every 2 s while a service starts, so `up --wait` is quick; once it
# is healthy, every 5 minutes: each check starts a process in the container.
x-health: &health
  start_period: 2m
  start_interval: 2s
  interval: 5m

# One image per party's web app, each with only that party's apps and the
# shared ones, and its start (demo/party.py): its folder at /data, its NHANES
# extract read-only at /nhanes.
#
# A hospital's web app: one container, two servers, each on a name only one
# network knows: the proxy reaches the pages, the practices only the lab-order
# endpoint (tests/quality/security/test_running_containers.py). Either one
# stopping stops the container, and compose restarts it. Ready when both
# answer, the pages under a name ALLOWED_HOSTS knows. The laboratory director
# provides the training cohort and fetches final models here, so the web app
# writes the cohort folder and screening-models, through the hospital's whole
# volume; it holds no SuperNode key. DEBUG off; plain HTTP, as the demo leaves
# out the report's TLS (tests/quality/security/test_compose.py).
x-hospital-web: &hospital-web
  image: ${COMPOSE_PROJECT_NAME}-hospital-web
  user: *user
  restart: unless-stopped
  depends_on:
    nhanes-download: {condition: service_completed_successfully}

# What every hospital's web app is told alike.
x-hospital-environment: &hospital-environment
  DJANGO_SETTINGS_MODULE: web.hospital.settings
  DATA_DIR: /data
  # Every practice, by its name.
  DEMO_REGISTER: |
    add_practice 'Huisartsenpraktijk De Akker'
    add_practice 'Huisartsenpraktijk De Berk'
    add_practice 'Huisartsenpraktijk De Ceder'
  # The startup's final-models endpoint.
  STARTUP_ADDRESS: startup-final-models:8442

x-startup-web: &startup-web
  image: ${COMPOSE_PROJECT_NAME}-startup-web
  user: *user

# A practice's web app: Django and gRPC only, no training package dependencies.
x-practice-web: &practice-web
  image: ${COMPOSE_PROJECT_NAME}-practice-web
  user: *user
  depends_on:
    nhanes-download: {condition: service_completed_successfully}
  command: [gunicorn, web.shared.wsgi, --bind=0.0.0.0:8000, --workers=2, --access-logfile=-]
  healthcheck:
    <<: *health
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/login/', timeout=5)"]

x-practice-environment: &practice-environment
  DJANGO_SETTINGS_MODULE: web.practice.settings
  DATA_DIR: /data

x-superexec: &superexec
  image: ${COMPOSE_PROJECT_NAME}-superexec
  user: *user

# Each hospital's SuperNode, and its ClientApp: the startup's code at the
# hospital (TB4), with only the cohort, read-only, so it writes nothing at the
# hospital, and a network that reaches nothing but its SuperNode
# (tests/quality/security/test_running_containers.py). The cohort folder is the
# hospital's, whose web app brings it.
x-supernode: &supernode
  image: flwr/supernode:1.40.0
  user: *user
  environment:
    FLWR_HOME: /tmp/flwr
  depends_on:
    flower-superlink: {condition: service_healthy}

services:
  # The one container that reaches the internet: it writes the public NHANES
  # extracts each party seeds from, one folder per party, on the host, and sees
  # no party's volume (demo/nhanes.py). Once they exist it is done in a second.
  nhanes-download:
    image: ${COMPOSE_PROJECT_NAME}-nhanes-download
    build: {context: .., dockerfile: demo/nhanes-download.Dockerfile}
    # A host folder compose creates belongs to root: hand it to the demo user.
    user: root
    entrypoint:
      - bash
      - -c
      - |
        chown "$$DEMO_USER" /demo/huggingface /demo/nhanes
        exec setpriv --reuid="$${DEMO_USER%%:*}" --regid="$${DEMO_USER##*:}" --clear-groups "$$@"
      - nhanes-download
    # Each hospital and its practice: cycle, folder names, the practice's patients.
    command: [python, -m, demo.nhanes, --out-dir, /demo/nhanes, --pair, 2005-2006, uz-leuven, huisartsenpraktijk-de-akker, "40", --pair, 2015-2016, heilig-hart-leuven, huisartsenpraktijk-de-berk, "24", --pair, 2017-2018, az-diest, huisartsenpraktijk-de-ceder, "12"]
    environment:
      DEMO_USER: *demo-user
      # Hugging Face may refuse unauthenticated downloads of the NHANES data.
      HF_TOKEN: ${HF_TOKEN:-}
      # Downloads and extracts stay on the host, so `down -v` fetches nothing again.
      HF_HOME: /demo/huggingface
    volumes:
      - ../.demo/huggingface:/demo/huggingface
      - ../.demo/nhanes:/demo/nhanes
    networks: [setup]

  # TB2, the startup.
  flower-superlink:
    image: flwr/superlink:1.40.0
    user: *user
    environment:
      FLWR_HOME: /tmp/flwr
    # Its folder is the startup's, whose web app brings it (demo/startup.Dockerfile).
    depends_on:
      startup-web: {condition: service_healthy}
    command:
      - --host=0.0.0.0
      - --port=9092
      - --database=/demo/startup/superlink/state.db
      - --isolation=process
      # Plaintext, any node admitted: the report's TLS and SuperNode
      # authentication are left out of the demo for simplicity.
      - --insecure
    volumes:
      - {type: volume, source: startup, target: /demo/startup/superlink, volume: {subpath: superlink}}
    networks: [startup, model-updates]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import socket; socket.create_connection(('localhost', 9092))"]

  flower-server-app:
    <<: *superexec
    build: {context: .., dockerfile: demo/superexec.Dockerfile}
    depends_on:
      flower-superlink: {condition: service_healthy}
    command:
      - --runtime-api-address=flower-superlink:9092
      - --insecure
    volumes:
      - {type: volume, source: startup, target: /demo/startup/final-models, volume: {subpath: final-models}}
    networks: [startup]

  # E1, the data scientist, submits from inside TB2: `docker compose run --rm train`.
  train:
    <<: *startup-web
    profiles: [train]
    depends_on:
      flower-superlink: {condition: service_healthy}
    # Not the web app's start (demo/party.py): the data scientist's command line.
    entrypoint: []
    command: [flwr, run, /app, demo, --run-config, "demo-dir='/demo'", --stream]
    # The startup's web app writes flwr-home/config.toml when it starts.
    environment:
      FLWR_HOME: /demo/startup/flwr-home
    volumes:
      - {type: volume, source: startup, target: /demo/startup/flwr-home, volume: {subpath: flwr-home}}
    networks: [startup]

  # The startup's web app: its data scientist sees the final models, submits
  # training runs and releases final models. One container, two servers, each on
  # a name only one network knows: the proxy reaches the pages, the hospitals'
  # web apps only the final-models endpoint (P5).
  # On the startup network to reach the SuperLink, which neither the proxy nor
  # a hospital reaches.
  startup-web:
    <<: *startup-web
    build: {context: .., dockerfile: demo/startup.Dockerfile}
    command:
      - bash
      - -c
      - |
        trap 'kill $$(jobs -p)' TERM INT
        gunicorn web.shared.wsgi --bind=startup-pages:8000 --workers=2 --access-logfile=- &
        python manage.py serve_final_models startup-final-models:8442 &
        wait -n
        exit 1
    restart: unless-stopped
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import socket, urllib.request; urllib.request.urlopen(urllib.request.Request('http://startup-pages:8000/login/', headers={'Host': 'localhost'}), timeout=5); socket.create_connection(('startup-final-models', 8442)).close()"]
    environment:
      DJANGO_SETTINGS_MODULE: web.startup.settings
      DATA_DIR: /data
      FLWR_HOME: /data/flwr-home
      DEMO_ADDRESS: http://startup.localhost:${DEMO_HTTP_PORT:-80}
      # Every hospital, as a recipient of released final models.
      DEMO_REGISTER: |
        add_hospital 'UZ Leuven'
        add_hospital 'Heilig Hart Leuven'
        add_hospital 'AZ Diest'
    volumes:
      - {type: volume, source: startup, target: /data}
      - {type: volume, source: startup, target: /data/final-models, read_only: true, volume: {subpath: final-models}}
    # Masked: the SuperLink's state is the SuperLink's alone.
    tmpfs: [/data/superlink]
    networks:
      startup: {}
      startup-web: {aliases: [startup-pages]}
      final-models: {aliases: [startup-final-models]}

  # TB1 and TB4, UZ Leuven.
  uz-leuven-flower-supernode:
    <<: *supernode
    command:
      - --superlink=flower-superlink:9092
      - --insecure
      - --isolation=process
      - --host=0.0.0.0
      - --port=9094
      - --node-config=data-path='/demo/hospitals/uz-leuven/cohort'
    networks: [model-updates, uz-leuven-flower-client-app]

  uz-leuven-flower-client-app:
    <<: *superexec
    depends_on:
      uz-leuven-flower-supernode: {condition: service_started}
      uz-leuven-web: {condition: service_healthy}
    command: [--runtime-api-address=uz-leuven-flower-supernode:9094, --insecure]
    volumes:
      - {type: volume, source: uz-leuven, target: /demo/hospitals/uz-leuven/cohort, read_only: true, volume: {subpath: cohort}}
    networks: [uz-leuven-flower-client-app]

  uz-leuven-web:
    <<: *hospital-web
    build: {context: .., dockerfile: demo/hospital.Dockerfile}
    command:
      - bash
      - -c
      - |
        trap 'kill $$(jobs -p)' TERM INT
        gunicorn web.shared.wsgi --bind=uz-leuven-pages:8000 --workers=2 --access-logfile=- &
        python manage.py serve_messages uz-leuven-messaging:8441 &
        wait -n
        exit 1
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import socket, urllib.request; urllib.request.urlopen(urllib.request.Request('http://uz-leuven-pages:8000/login/', headers={'Host': 'localhost'}), timeout=5); socket.create_connection(('uz-leuven-messaging', 8441)).close()"]
    environment:
      <<: *hospital-environment
      DEMO_ADDRESS: http://uz-leuven.localhost:${DEMO_HTTP_PORT:-80}
      # Its laboratory director provided the training cohort at start.
      DEMO_PROVIDE: "1"
      # Its name: shown on its pages, and what it calls the startup as.
      HOSPITAL_NAME: UZ Leuven
      PRIMARY_COLOUR: jade
    volumes:
      - {type: volume, source: uz-leuven, target: /data}
      - ../.demo/nhanes/uz-leuven:/nhanes:ro
    networks:
      uz-leuven: {aliases: [uz-leuven-pages]}
      messaging: {aliases: [uz-leuven-messaging]}
      final-models: {}

  # TB1 and TB4, Heilig Hart Leuven.
  heilig-hart-leuven-flower-supernode:
    <<: *supernode
    command:
      - --superlink=flower-superlink:9092
      - --insecure
      - --isolation=process
      - --host=0.0.0.0
      - --port=9094
      - --node-config=data-path='/demo/hospitals/heilig-hart-leuven/cohort'
    networks: [model-updates, heilig-hart-leuven-flower-client-app]

  heilig-hart-leuven-flower-client-app:
    <<: *superexec
    depends_on:
      heilig-hart-leuven-flower-supernode: {condition: service_started}
      heilig-hart-leuven-web: {condition: service_healthy}
    command: [--runtime-api-address=heilig-hart-leuven-flower-supernode:9094, --insecure]
    volumes:
      - {type: volume, source: heilig-hart-leuven, target: /demo/hospitals/heilig-hart-leuven/cohort, read_only: true, volume: {subpath: cohort}}
    networks: [heilig-hart-leuven-flower-client-app]

  heilig-hart-leuven-web:
    <<: *hospital-web
    command:
      - bash
      - -c
      - |
        trap 'kill $$(jobs -p)' TERM INT
        gunicorn web.shared.wsgi --bind=heilig-hart-leuven-pages:8000 --workers=2 --access-logfile=- &
        python manage.py serve_messages heilig-hart-leuven-messaging:8441 &
        wait -n
        exit 1
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import socket, urllib.request; urllib.request.urlopen(urllib.request.Request('http://heilig-hart-leuven-pages:8000/login/', headers={'Host': 'localhost'}), timeout=5); socket.create_connection(('heilig-hart-leuven-messaging', 8441)).close()"]
    environment:
      <<: *hospital-environment
      DEMO_ADDRESS: http://heilig-hart-leuven.localhost:${DEMO_HTTP_PORT:-80}
      # Its laboratory director provided the training cohort at start.
      DEMO_PROVIDE: "1"
      # Its name: shown on its pages, and what it calls the startup as.
      HOSPITAL_NAME: Heilig Hart Leuven
      PRIMARY_COLOUR: pumpkin
    volumes:
      - {type: volume, source: heilig-hart-leuven, target: /data}
      - ../.demo/nhanes/heilig-hart-leuven:/nhanes:ro
    networks:
      heilig-hart-leuven: {aliases: [heilig-hart-leuven-pages]}
      messaging: {aliases: [heilig-hart-leuven-messaging]}
      final-models: {}

  # TB1 and TB4, AZ Diest.
  az-diest-flower-supernode:
    <<: *supernode
    command:
      - --superlink=flower-superlink:9092
      - --insecure
      - --isolation=process
      - --host=0.0.0.0
      - --port=9094
      - --node-config=data-path='/demo/hospitals/az-diest/cohort'
    networks: [model-updates, az-diest-flower-client-app]

  az-diest-flower-client-app:
    <<: *superexec
    depends_on:
      az-diest-flower-supernode: {condition: service_started}
      az-diest-web: {condition: service_healthy}
    command: [--runtime-api-address=az-diest-flower-supernode:9094, --insecure]
    volumes:
      - {type: volume, source: az-diest, target: /demo/hospitals/az-diest/cohort, read_only: true, volume: {subpath: cohort}}
    networks: [az-diest-flower-client-app]

  az-diest-web:
    <<: *hospital-web
    command:
      - bash
      - -c
      - |
        trap 'kill $$(jobs -p)' TERM INT
        gunicorn web.shared.wsgi --bind=az-diest-pages:8000 --workers=2 --access-logfile=- &
        python manage.py serve_messages az-diest-messaging:8441 &
        wait -n
        exit 1
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import socket, urllib.request; urllib.request.urlopen(urllib.request.Request('http://az-diest-pages:8000/login/', headers={'Host': 'localhost'}), timeout=5); socket.create_connection(('az-diest-messaging', 8441)).close()"]
    environment:
      <<: *hospital-environment
      DEMO_ADDRESS: http://az-diest.localhost:${DEMO_HTTP_PORT:-80}
      # Its name: shown on its pages, and what it calls the startup as.
      HOSPITAL_NAME: AZ Diest
      PRIMARY_COLOUR: violet
    volumes:
      - {type: volume, source: az-diest, target: /data}
      - ../.demo/nhanes/az-diest:/nhanes:ro
    networks:
      az-diest: {aliases: [az-diest-pages]}
      messaging: {aliases: [az-diest-messaging]}
      final-models: {}

  # TB3, each general practitioner's practice, sending samples to every hospital's
  # laboratory: on the messaging network.
  huisartsenpraktijk-de-akker-web:
    <<: *practice-web
    build: {context: .., dockerfile: demo/practice.Dockerfile}
    environment:
      <<: *practice-environment
      DEMO_ADDRESS: http://huisartsenpraktijk-de-akker.localhost:${DEMO_HTTP_PORT:-80}
      # Every hospital's laboratory; its paired hospital's is the primary one.
      DEMO_REGISTER: |
        add_laboratory 'UZ Leuven' uz-leuven-messaging:8441 --primary
        add_laboratory 'Heilig Hart Leuven' heilig-hart-leuven-messaging:8441
        add_laboratory 'AZ Diest' az-diest-messaging:8441
      # Its name: shown on its pages, and what it calls each hospital as.
      PRACTICE_NAME: Huisartsenpraktijk De Akker
      PRIMARY_COLOUR: green
    volumes:
      - {type: volume, source: huisartsenpraktijk-de-akker, target: /data}
      - ../.demo/nhanes/huisartsenpraktijk-de-akker:/nhanes:ro
    networks: [huisartsenpraktijk-de-akker, messaging]

  huisartsenpraktijk-de-berk-web:
    <<: *practice-web
    environment:
      <<: *practice-environment
      DEMO_ADDRESS: http://huisartsenpraktijk-de-berk.localhost:${DEMO_HTTP_PORT:-80}
      # Every hospital's laboratory; its paired hospital's is the primary one.
      DEMO_REGISTER: |
        add_laboratory 'UZ Leuven' uz-leuven-messaging:8441
        add_laboratory 'Heilig Hart Leuven' heilig-hart-leuven-messaging:8441 --primary
        add_laboratory 'AZ Diest' az-diest-messaging:8441
      # Its name: shown on its pages, and what it calls each hospital as.
      PRACTICE_NAME: Huisartsenpraktijk De Berk
      PRIMARY_COLOUR: amber
    volumes:
      - {type: volume, source: huisartsenpraktijk-de-berk, target: /data}
      - ../.demo/nhanes/huisartsenpraktijk-de-berk:/nhanes:ro
    networks: [huisartsenpraktijk-de-berk, messaging]

  huisartsenpraktijk-de-ceder-web:
    <<: *practice-web
    environment:
      <<: *practice-environment
      DEMO_ADDRESS: http://huisartsenpraktijk-de-ceder.localhost:${DEMO_HTTP_PORT:-80}
      # Every hospital's laboratory; its paired hospital's is the primary one.
      DEMO_REGISTER: |
        add_laboratory 'UZ Leuven' uz-leuven-messaging:8441
        add_laboratory 'Heilig Hart Leuven' heilig-hart-leuven-messaging:8441
        add_laboratory 'AZ Diest' az-diest-messaging:8441 --primary
      # Its name: shown on its pages, and what it calls each hospital as.
      PRACTICE_NAME: Huisartsenpraktijk De Ceder
      PRIMARY_COLOUR: purple
    volumes:
      - {type: volume, source: huisartsenpraktijk-de-ceder, target: /data}
      - ../.demo/nhanes/huisartsenpraktijk-de-ceder:/nhanes:ro
    networks: [huisartsenpraktijk-de-ceder, messaging]

  # Between the browser and the parties, like the internet: routes each
  # <party>.localhost by its Host header. The only published port.
  proxy:
    image: nginx:1.28-alpine
    user: *user
    depends_on:
      nhanes-download: {condition: service_completed_successfully}
    ports: ["127.0.0.1:${DEMO_HTTP_PORT:-80}:8080"]
    volumes: ["./proxy.conf:/etc/nginx/nginx.conf:ro"]
    healthcheck:
      <<: *health
      test: [CMD, nc, -z, 127.0.0.1, "8080"]
    networks:
      [startup-web, uz-leuven, heilig-hart-leuven, az-diest,
       huisartsenpraktijk-de-akker, huisartsenpraktijk-de-berk, huisartsenpraktijk-de-ceder]

networks:
  setup: {}
  startup: {internal: true}
  startup-web: {}
  final-models: {internal: true}
  model-updates: {internal: true}
  messaging: {internal: true}
  uz-leuven: {}
  uz-leuven-flower-client-app: {internal: true}
  heilig-hart-leuven: {}
  heilig-hart-leuven-flower-client-app: {internal: true}
  az-diest: {}
  az-diest-flower-client-app: {internal: true}
  huisartsenpraktijk-de-akker: {}
  huisartsenpraktijk-de-berk: {}
  huisartsenpraktijk-de-ceder: {}

# One per party: `docker compose down -v` deletes them all.
volumes:
  startup: {}
  uz-leuven: {}
  heilig-hart-leuven: {}
  az-diest: {}
  huisartsenpraktijk-de-akker: {}
  huisartsenpraktijk-de-berk: {}
  huisartsenpraktijk-de-ceder: {}
