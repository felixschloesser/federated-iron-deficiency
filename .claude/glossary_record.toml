# What the glossaries' words (web/*/glossary.toml) replaced, and when the team decided a word: the
# process's record, kept out of readers' way. The report was drafted with AI
# help, so a word that reads badly to lab staff is replaced and the report's
# word moves to its rejected list. A term here is a term in one of them.

["general practitioner"]
decided = "2026-11-03"
rejected = ["GP (abbreviation)", "requester", "ordering physician (WHO 5-4, p. 66)"]

["laboratory"]
rejected = ["lab (the report's short form, kept only in \"lab order\" and \"lab report\")", "hospital (the organisation, not where the tube goes)"]

["primary laboratory"]
decided = "2026-11-05"
rejected = ["default laboratory (developer word)", "home laboratory", "paired hospital (the demo's pairing, not a laboratory)", "lab (kept only in \"lab order\" and \"lab report\")"]

["laboratory staff"]
rejected = ["lab technician (\"technician\" in WHO LQMS means equipment service only)", "technologist (a qualified grade)", "laboratorian", "laboratory worker"]

["analyser"]
rejected = ["nhanes (the demo data's origin, not what the app is)", "instrument (WHO LQMS's general word; the report says analyser)", "stand-in (says how it is built, not what it is)", "tube (the glossary's rejected word for the container)"]

["patient"]
rejected = ["participant (NHANES word; data origin only)"]

["patient number"]
decided = "2026-11-08"
rejected = ["nhanes number (the demo data's origin; the code's word until 2026-11-08)", "SEQN (NHANES's word)", "hospital number (the hospital's, not the practice's)", "patient identifier (WHO's general word)"]

["practice"]
rejected = ["client (WHO 13-2; the code's word until 2026-11-03)", "sender", "requester"]

["name"]
decided = "2026-11-07"
rejected = ["certificate name (the report's word; the demo has no certificates)", "practice name (the same name, now one)", "registered name", "practice ID (no source)", "hospital ID (no source)", "client ID (OAuth's word)", "RIZIV/INAMI number (identifies a doctor, not a practice)", "client name"]

["order"]
rejected = ["request (the laboratory's word)", "requisition (WHO)", "examination request (ISO 15189)"]

["lab order"]
rejected = ["order (the practice's)", "test request (the laboratory's)"]

["test request"]
rejected = ["lab order (the message it arrives as)", "order (US and HL7 usage)", "requisition (WHO: the paper form)", "examination request (ISO 15189)"]

["test"]
rejected = ["examination (ISO 15189)"]

["CBC (complete blood count)"]
rejected = ["blood count (report uses both; one word only)"]

["clinical indication"]
rejected = ["reason for testing"]

["suspected anaemia"]
rejected = ["anaemia work-up"]

["suspected irritable bowel syndrome"]
rejected = ["IBS (abbreviation)"]

["unexplained fatigue"]
rejected = ["non-specific complaint (no source; the report's earlier word)", "fatigue work-up"]

["start of pregnancy"]
rejected = ["pregnancy check"]

["chronic kidney disease follow-up"]
rejected = ["CKD (abbreviation)"]

["other"]
decided = "2026-11-01"
rejected = []

["screened indication"]
rejected = ["screen requested (the general practitioner requests nothing)", "eligible (also sex and age)"]

["not eligible"]
rejected = ["not screened because of indication", "sex or age"]

["registered sex"]
rejected = ["gender", "sex"]

["sample ID"]
rejected = ["laboratory identification number", "accession number (WHO 5-4, p. 66)"]

["stored sample"]
rejected = ["add-on test", "retained sample"]

["sample"]
