["screening result"]
rejected = ["flag", "outcome", "classification"]

["ferritin suggested / ferritin not suggested / not screened / screening failed"]
rejected = ["flagged / not flagged (an earlier report draft; in a lab a *flag* marks an out-of-range value)", "possible iron deficiency (names a diagnosis)"]

["final model"]
decided = "2026-11-08"
rejected = ["release", "model version"]

["screening model"]
