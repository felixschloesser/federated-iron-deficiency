{% comment %}Index header: a page title and the page's primary actions.
Include with: title, and actions (a list of {url, label}; omit for none).{% endcomment %}
<hgroup>
  <h1>{{ title }}</h1>
</hgroup>
{% if actions %}
<p>{% for action in actions %}<a href="{{ action.url }}" role="button">{{ action.label }}</a> {% endfor %}</p>
{% endif %}
