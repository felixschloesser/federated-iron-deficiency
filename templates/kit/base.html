{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Iron-deficiency screening</title>
  <link rel="stylesheet" href="{% static 'css/vendor/pico-2.1.1/pico.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="container">
    <nav>
      <ul><li><strong>Iron-deficiency screening</strong></li></ul>
      {% if user.is_authenticated %}
      <ul>
        {% block nav %}{% endblock %}
        <li>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="secondary outline">Log out</button>
          </form>
        </li>
      </ul>
      {% endif %}
    </nav>
  </header>
  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
