[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iron-deficiency"
version = "1.3.0"
description = "Federated iron-deficiency screening with PyTorch and Flower"
license = {file = "LICENSE"}
requires-python = ">=3.13"
dependencies = [
    "flwr>=1.40.0",  # fab-include, checked with 1.40
    "flwr-datasets>=0.6.1",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "ray==2.55.1; sys_platform != \"win32\"",  # simulation runtime skips flwr[simulation] extras
    "scikit-learn>=1.5.0",
    "torch==2.10.0",
    "wandb>=0.28.2,<0.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ml"]

[tool.flwr.app]
publisher = "javier"
fab-format-version = 1
# Allowlist: the web app and docs in this repo must not reach the SuperNodes.
fab-include = ["/ml/**", "/README.md", "/LICENSE"]
flwr-version-target = "1.40.0"

[tool.flwr.app.components]
serverapp = "ml.server_app:app"
clientapp = "ml.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
fraction-evaluate = 1.0
local-epochs = 1
learning-rate = 0.01
weight-decay = 0.001
batch-size = 64
model-seed = 42 # Initial weights and dropout; data splits stay fixed
demo-dir = "" # Absolute folder for final models (demo/README.md); empty: ~/.cache/iron-deficiency
wandb-api-key = "" # Pass at submit time: -c "wandb-api-key='$WANDB_API_KEY'"

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "grpcio-tools>=1.81.1",
    "mypy>=2.4.1",
    "mypy-protobuf>=5.1.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8",
    "pytest-bdd>=9.0.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
    "scipy-stubs>=1.18.1.1",
    "tqdm>=4.70.1",
    "types-grpcio>=1.85.0.20261028",
    "types-tqdm>=4.67",
]
web = [
    "django>=5.2,<6",
    "django-stubs-ext>=6.1.2",
    "grpcio>=1.84.0",
    "gunicorn>=26.2.0",
    # The lab-order messages; flwr brings it too, but a practice installs no flwr.
    "protobuf>=6.33.6",
    "whitenoise>=6.12.0",
]

[tool.uv]
default-groups = ["dev", "web"]

[tool.mypy]
# .claude holds the audit, a commit gate kept out of readers' way.
mypy_path = "typings:.claude"
# Runtime output of demo/demo.py (gitignored), holding unpacked copies of the app.
exclude = ["^\\.demo/"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "typecheck_settings"

[tool.pytest.ini_options]
testpaths = ["tests", ".claude/tests"]
# The audit and red_first live in .claude/, out of readers' way; their tests import them.
pythonpath = [".claude"]
# Every test is a function: no class is collected, so domain classes named
# Test... (Test, TestRequest) can be imported into tests as they are.
python_classes = []
bdd_features_base_dir = "features/"
# A parametrisation that finds nothing fails, never skips quietly.
empty_parameter_set_mark = "fail_at_collect"
# Container-backed and NHANES-backed tests run only as merge gates:
# pytest -m containers, pytest -m nhanes
addopts = "-m 'not containers and not nhanes'"
markers = [
    "containers: needs a running Docker engine (every test in tests/e2e/, and those marked elsewhere)",
    # The quick loop leaves these out: pytest -m "not containers and not subprocess"
    "subprocess: starts a process of its own (manage.py, uv, flwr), a second or more each",
    "nhanes: trains on the pinned NHANES revision (downloads it once, about a minute)",
]

[tool.ruff]
# protoc's output (web/shared/messaging/__init__.py): generated, not ours to style.
extend-exclude = ["*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py", "*_pb2_grpc.pyi"]

[tool.ruff.lint.isort]
known-first-party = [
    "audit",
    "demo",
    "ml",
    "red_first",
    "tests",
    "web",
]

# Torch on Linux from PyTorch's CPU index: the containers screen and train on
# CPU, and PyPI's x86-64 wheel would pull several GB of CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
