[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iron-deficiency"
version = "1.3.0"
description = "Federated iron-deficiency classification with PyTorch and Flower"
license = {file = "LICENSE"}
requires-python = ">=3.13"
dependencies = [
    "flwr>=1.40.0",  # fab-include, checked with 1.40
    "flwr-datasets>=0.6.1",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "ray==2.55.1; sys_platform != \"win32\"",  # simulation runtime skips flwr[simulation] extras
    "scikit-learn>=1.5.0",
    "torch==2.10.0",
    "wandb>=0.28.2,<0.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["iron_deficiency"]

[tool.flwr.app]
publisher = "javier"
fab-format-version = 1
# Allowlist: the web app and docs in this repo must not reach the SuperNodes.
fab-include = ["/iron_deficiency/**", "/scripts/**", "/README.md", "/LICENSE"]
flwr-version-target = "1.40.0"

[tool.flwr.app.components]
serverapp = "iron_deficiency.server_app:app"
clientapp = "iron_deficiency.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
fraction-evaluate = 1.0
local-epochs = 1
learning-rate = 0.01
weight-decay = 0.001
batch-size = 64
screening-threshold = 0.5
model-seed = 42 # Initial weights and dropout; data splits stay fixed
demo-dir = "" # Absolute folder for final models (spec §9); empty: ~/.cache/iron-deficiency
wandb-api-key = "" # Pass at submit time: -c "wandb-api-key='$WANDB_API_KEY'"

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "mypy>=2.4.1",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8",
    "pytest-bdd>=9.0.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
    "scipy-stubs>=1.18.1.1",
]
web = [
    "django>=5.2,<6",
    "django-stubs-ext>=6.1.2",
]

[tool.uv]
default-groups = ["dev", "web"]

[tool.mypy]
mypy_path = "typings"
# Runtime output of tools/demo.py (gitignored), holding unpacked copies of the app.
exclude = ["^demo/"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "web.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "web.settings"
bdd_features_base_dir = "features/"

[tool.ruff.lint.isort]
known-first-party = ["iron_deficiency", "tests", "tools", "web"]
