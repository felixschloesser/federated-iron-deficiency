[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iron-deficiency"
version = "1.3.0"
description = "Federated iron-deficiency classification with PyTorch and Flower"
license = {file = "LICENSE"}
dependencies = [
    "flwr>=1.34.0",
    "flwr-datasets>=0.6.1",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "ray==2.55.1; sys_platform != \"win32\"",  # simulation runtime skips flwr[simulation] extras
    "scikit-learn>=1.5.0",
    "torch==2.10.0",
    "wandb>=0.28.2,<0.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["iron_deficiency"]

[tool.flwr.app]
publisher = "javier"
fab-format-version = 1
flwr-version-target = "1.34.0"

[tool.flwr.app.components]
serverapp = "iron_deficiency.server_app:app"
clientapp = "iron_deficiency.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
fraction-evaluate = 1.0
local-epochs = 1
learning-rate = 0.01
weight-decay = 0.001
batch-size = 64
wandb-api-key = "" # Pass at submit time: -c "wandb-api-key='$WANDB_API_KEY'"
