# The glossary: the domain's words, each with its source, why it was chosen,
# and the words it replaces. Model, form, template and copy use these words.
#
# The PIA report is the first source, the WHO *Laboratory Quality Management
# System Handbook* (2011, ISBN 9789241548274,
# https://www.who.int/publications/i/item/9789241548274) the second. The report
# was drafted with AI help, so a word that reads badly to lab staff is replaced
# and the report's word moves to its rejected list.

["general practitioner"]
source = "Report, Stakeholders table (\"GP\", spelled out); one per practice: user decision, 2026-11-03"
why = "The report's orderer and reader of the lab report; spelled out everywhere in the app. A practice, and so its app, has exactly one"
rejected = [
    "GP (abbreviation)",
    "requester",
    "ordering physician (WHO 5-4, p. 66)",
]

["laboratory"]
source = "Report, \"Federated version\": the practice \"sends its hospital's laboratory lab orders\"; \"the sample reaches the laboratory\""
why = "Where a sample goes: a hospital's laboratory the practice works with, chosen at *Collect sample*; every test on the sample follows it"
rejected = [
    "lab (the report's short form, kept only in \"lab order\" and \"lab report\")",
    "hospital (the organisation, not where the tube goes)",
]

["primary laboratory"]
source = "User decision, 2026-11-05 (\"primary lab\"); stands for the report's single laboratory, \"Federated version\": the practice \"sends its hospital's laboratory lab orders\""
why = "The laboratory a practice sends its samples to unless the general practitioner picks another, preselected at *Collect sample*; in the demo the paired hospital's, so lab orders follow the hospitals' sizes"
rejected = [
    "default laboratory (developer word)",
    "home laboratory",
    "paired hospital (demo.toml's pairing, not a laboratory)",
    "lab (kept only in \"lab order\" and \"lab report\")",
]

["laboratory staff"]
source = "WHO LQMS, the handbook's word for the people who work in the laboratory (44 uses; e.g. ch. 5, Sample management)"
why = "Run the analyser; one record per person (`LaboratoryStaffMember`)"
rejected = [
    "lab technician (\"technician\" in WHO LQMS means equipment service only)",
    "technologist (a qualified grade)",
    "laboratorian",
    "laboratory worker",
]

["patient"]
source = "Report, Use case"
why = "The report's word"
rejected = ["participant (NHANES word; data origin only)"]

["practice"]
source = "Report, \"Federated version\": \"Each GP practice runs its own app\"; \"Design choices and assumptions\", DF24: \"Lab orders, with the sending practice\""
why = "Who orders at the hospital: a general practitioner's practice, through its app, with one general practitioner (features/access.feature). The lab holds each sample by its practice"
rejected = [
    "client (WHO 13-2; the code's word until 2026-11-03)",
    "sender",
    "requester",
]

["certificate name"]
source = "Report, Solutions table, mutual TLS: \"each hospital is its own CA and tells practices apart by certificate name\"; user decision, 2026-11-05"
why = "The name the hospital issued a practice and registers it by (`add_practice`): the lab's key for the practice, which its app sends in every message (`PRACTICE_CERTIFICATE_NAME`). The demo trusts it as sent; with the report's mutual TLS it would come from the practice's certificate. A message from a name the hospital does not know is refused"
rejected = [
    "practice ID (no source)",
    "practice name (chosen by the sender, neither stable nor unique; the lab's key until 2026-11-05)",
    "client ID",
    "RIZIV/INAMI number (identifies a doctor, not a practice)",
]

["practice name"]
source = "Report, \"Design choices and assumptions\", DF24: \"Lab orders, with the sending practice\"; the names in demo.toml (`practice = \"Huisartsenpraktijk De Akker\"`)"
why = "The practice's own name (`PRACTICE_NAME`), shown on its pages; the hospital registers it beside the certificate name, which is the lab's key, and it is never sent"
rejected = [
    "client name",
]

["order"]
source = "Report, DF23 \"lab order\"; WHO glossary *path of workflow*, \"physician's order\" (p. 228)"
why = "Report and WHO agree"
rejected = ["request", "requisition (WHO)", "examination request (ISO 15189)"]

["test"]
source = "Report, Use case \"ferritin test\""
why = "Order picks one: CBC or ferritin"
rejected = ["examination (ISO 15189)"]

["CBC (complete blood count)"]
source = "Report, Use case"
why = "The report's word for the routine test"
rejected = ["blood count (report uses both; one word only)"]

["clinical indication"]
source = "Report, Data table"
why = "The report's word; decides screening (features/screening.feature). One of the six below, in the guidelines' words"
rejected = ["reason for testing"]

["suspected anaemia"]
source = "Domus Medica, *Aanvraag van laboratoriumtests door huisartsen*, key messages, Huisarts Nu 2012;41(4), S6: \"Bepaal Hb om de diagnose van anemie te stellen\"; NHG-Standaard Anemie 2014, H&W 57(10) p. 528: Hb for \"moeheid, duizeligheid, algemene malaise, bleekheid of hevig menstrueel bloedverlies\""
why = "Screened: ferritin follows only once anaemia is found (Domus S6), so a woman who is iron deficient without anaemia is missed"
rejected = ["anaemia work-up"]

["suspected irritable bowel syndrome"]
source = "Domus Medica, *Aanvraag van laboratoriumtests door huisartsen*, key messages, Huisarts Nu 2012;41(4), S8: \"rode bloedcellen, hematocriet, hemoglobine, witte bloedcellen, sedimentatie, CRP\""
why = "Screened: a CBC without ferritin"
rejected = ["IBS (abbreviation)"]

["unexplained fatigue"]
source = "Domus Medica, *Aanvraag van laboratoriumtests door huisartsen*, key messages, Huisarts Nu 2012;41(4), S8: lab tests \"wanneer de moeheid meer dan een maand aanhoudt … Bepaal ook ferritine bij vrouwen op vruchtbare leeftijd\""
why = "Screened, though the guideline already adds ferritin for women of childbearing age: the suggestion helps only where ferritin was left out"
rejected = [
    "non-specific complaint (no source; the report's earlier word)",
    "fatigue work-up",
]

["start of pregnancy"]
source = "Domus Medica, *Aanvraag van laboratoriumtests door huisartsen*, key messages, Huisarts Nu 2012;41(4), S9: \"Bepaal Hb, RBC en Hct … bij Hb <9,5 g/100 ml … ferritinebepaling\""
why = "Not screened: pregnancy has its own Hb rule, and the cohort was not checked for pregnancy"
rejected = ["pregnancy check"]

["chronic kidney disease follow-up"]
source = "WOREL, *Aanvraag van laboratoriumtests (deel 1)*, 2026, p. 42: \"Bepaal minstens jaarlijks het hemoglobinegehalte … om te screenen op renale anemie\""
why = "Not screened: monitoring a known disease, whose anaemia has another cause"
rejected = ["CKD (abbreviation)"]

["other"]
source = "User decision, 2026-11-01: the guidelines are organised by indication and name no catch-all"
why = "Not screened"
rejected = []

["screened indication"]
source = "Report, Data table: \"the three screened indications\""
why = "All the lab order says of the clinical indication: whether it is one the screening covers (features/screening.feature, features/messaging.feature), never which"
rejected = [
    "screen requested (the general practitioner requests nothing)",
    "eligible (also sex and age)",
]

["not eligible"]
source = "Built from the report's Use case: the screening applies to one group, women aged 18–49 with a screened indication (features/screening.feature)"
why = "The not-screened reason when the screening excludes a CBC (an indication not screened, not female, or not aged 18–49), never which condition (features/screening.feature)"
rejected = ["not screened because of indication", "sex or age"]

["registered sex"]
source = "Report, Data table"
why = "Distinguishes the record from the person (report, Information at risk)"
rejected = ["gender", "sex"]

["sample ID"]
source = "Report, DF23 and Data table"
why = "The report's link between lab order, results and lab report; on the sample's label. In the demo the patient's NHANES number and the sample's number for that patient, e.g. 135318-2"
rejected = [
    "laboratory identification number",
    "accession number (WHO 5-4, p. 66)",
]

["stored sample"]
source = "WHO LQMS 5-5, p. 68, \"stored samples\""
why = "A sample the laboratory already holds: a later test is measured on it"
rejected = ["add-on test", "retained sample"]

["sample"]
source = "WHO LQMS ch. 5, *Sample management* (the handbook's word throughout)"
why = "Blood collected from one patient at one time; each order is on one sample, and one sample may carry a CBC and a later ferritin"
rejected = ["specimen (ISO 15189)", "tube (the container)", "blood draw"]

["collected"]
source = "WHO LQMS 5-3, p. 64: \"the health care provider may collect a sample in a clinic setting\"; 5-4, p. 66, register field \"date and time of collection\""
why = "When the general practitioner's practice takes the blood; recorded on the sample"
rejected = ["drawn", "taken", "venipuncture"]

["analysed"]
source = "Report, P1 \"Lab analysis\""
why = "The report's process name"
rejected = ["examined", "tested"]

["screening"]
source = "Report, P7"
why = "The report's process name"
rejected = ["scoring", "classification"]

["screening result"]
source = "Report, DF31 \"screening result\", P10"
why = "What screening records per CBC: one of the three below, with the reason when not screened (features/screening.feature) and the screening model when screened (features/screening.feature)"
rejected = ["flag", "outcome", "classification"]

["ferritin suggested / ferritin not suggested / not screened"]
source = "Report, Use case \"a comment to the lab report suggesting ferritin\"; \"not screened\" from Federated version"
why = "Names the action for the general practitioner; avoids the lab meaning of *flag*"
rejected = [
    "flagged / not flagged (an earlier report draft; in a lab a *flag* marks an out-of-range value)",
    "possible iron deficiency (names a diagnosis)",
]

["final model"]
source = "Report, DS4, DF8 \"final model, threshold\""
why = "What one training run sends to every hospital; stored there with its run ID and local validation"
rejected = ["release", "model version"]

["screening model"]
source = "Built from the report's words: P10 *Screening* and \"the model\" (Use case)"
why = "Named after its purpose at the hospital: a model that can screen this hospital's CBCs. What the laboratory director compares and deploys, named by when it arrived (\"Screening model of 30 Oct 2026, 14:02\") with its run ID as a detail. A final model becomes a screening model when it reaches the hospital, into its `screening-models/` folder"
rejected = [
    "model (too generic; Django's `Model`)",
    "final model (kept for training code and the report's DFD)",
    "release",
    "model version",
]

["deploy"]
source = "Report, Use case: the model \"is then deployed to every hospital\""
why = "The laboratory director's decision that a screening model screens this hospital's patients"
rejected = ["activate", "release", "roll out"]

["deployment (of a party)"]
source = "Flower documentation, \"Deployment Engine\": running the federation on real nodes, not in simulation"
why = "One party's running copy of the code, in its own folder (demo/README.md); never a final model being deployed"
rejected = ["installation", "instance"]

["deployed model"]
source = "Report, DF29, DF30 \"deployed final model\""
why = "The screening model this hospital deployed last; the only one that screens"
rejected = ["active release", "fingerprint"]

["laboratory director"]
source = "WHO LQMS ch. 2, p. 21: the director assesses \"all potential risks … including services to patients\" (20 uses)"
why = "Decides which screening model screens patients; one per hospital (features/deployment.feature), as WHO's singular has it"
rejected = [
    "clinical biologist (not in either source)",
    "quality manager (WHO: runs the quality system, does not decide)",
    "laboratory manager",
]

["local validation"]
source = "Built from *validation* (report, DF10 \"validation example count\")"
why = "A screening model on this hospital's own validation split: the confusion matrix at its threshold, as counts, then AUROC"
rejected = ["local evaluation", "shadow run", "flag rate"]

["sensitivity"]
source = "WHO LQMS 3-3, p. 40: test methods are \"evaluated for the ability to detect disease (sensitivity, specificity, positive and negative predictive value)\""
why = "Iron-deficient women of the local validation whom the screening model suggests ferritin for, shown as counts and a percentage"
rejected = [
    "recall (machine learning, not a laboratory word)",
    "true positive rate",
]

["specificity"]
source = "WHO LQMS 3-3, p. 40: test methods are \"evaluated for the ability to detect disease (sensitivity, specificity, positive and negative predictive value)\""
why = "Women without iron deficiency whom it does not suggest ferritin for"
rejected = ["true negative rate"]

["positive predictive value"]
source = "WHO LQMS 3-3, p. 40: test methods are \"evaluated for the ability to detect disease (sensitivity, specificity, positive and negative predictive value)\""
why = "Ferritin suggestions that were right: what a suggestion is worth to the general practitioner"
rejected = [
    "precision (in the laboratory: how much repeated measurements vary, WHO LQMS p. 82)",
    "unnecessary suggestions (its complement, shown inside it)",
]

["negative predictive value"]
source = "WHO LQMS 3-3, p. 40: test methods are \"evaluated for the ability to detect disease (sensitivity, specificity, positive and negative predictive value)\""
why = "Women without a suggestion who were not iron deficient: what a silent lab report is worth (features/reports.feature)"
rejected = []

["threshold"]
source = "Report, Design choices"
why = "The report's word"
rejected = ["cutoff (reserved for ferritin's 15 ng/mL)"]

["lab report"]
source = "Report, DF25"
why = "The report's word"
rejected = ["test report (WHO p. 193)"]

["comment"]
source = "Report, Use case; WHO report contents \"applicable comments\" (p. 193)"
why = "Both sources. The only comment is the suggestion: \"Ferritin suggested by the hospital's screening of this CBC. Likely iron deficiency; not a diagnosis.\" (\"likely iron deficient\": report, Use case)"
rejected = ["interpretive comment"]

["CBC value names and units, e.g. *Hemoglobin*, g/dL"]
source = "NHANES 2021–2023 CBC_L codebook, SAS labels (https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2021/DataFiles/CBC_L.htm)"
why = "The values are NHANES's own, in its units; no conversion"
rejected = ["Hb", "Ht and other report abbreviations (no source; other units)"]

["Ferritin, ng/mL"]
source = "NHANES 2021–2023 FERTIN_L codebook (https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2021/DataFiles/FERTIN_L.htm)"
why = "As above"
rejected = ["µg/L (LBDFERSI)"]

["Ferritin (made up for the demo), ng/mL"]
source = "User decision, 2026-11-01: NHANES has no ferritin for men and women outside 12–49"
why = "Tells the general practitioner the value is not a measurement; kept apart from ferritin so it never feeds a suggestion or a label"
rejected = [
    "ferritin (would pass a made-up value as measured)",
    "synthetic ferritin",
]

["Flower container (`flower-` prefix)"]
source = "Flower documentation, *Flower Architecture*: SuperLink, ServerApp, SuperNode, ClientApp"
why = "Marks the compose services that are Flower's components, apart from each party's own apps; Flower's own names, as words: `flower-superlink`, `flower-server-app`, `<hospital>-flower-supernode`, `<hospital>-flower-client-app` (and its TB4 network)"
rejected = [
    "`serverapp`",
    "`clientapp` (Flower's names run together); startup code (the report's TB4 label, which the report keeps)",
]

["startup"]
source = "Report, Stakeholders table: the startup \"Runs the SuperLink and ServerApp, writes the ClientApp and configures runs\""
why = "The report's party that trains the model; its web app shows the final models it keeps (DS4)"
rejected = ["company", "vendor", "server (one of its machines, not the party)"]

["data scientist"]
source = "Report, training DFD, E1 \"Data scientist\"; \"its data scientist submits the app, which is based on @ironapp, and follows the run's logs (DF4, DF5)\""
why = "The startup's one person in the report's DFD; the role of its web app (`DataScientist`)"
rejected = ["ML engineer", "researcher", "startup staff"]

["training run"]
source = "Report, DS4 \"Startup's final models\", one per run; DF13 \"Final model weights, per run\"; Flower documentation, `flwr run`"
why = "One federated training of the model, from the startup's submission to the final model it sends every hospital"
rejected = ["job", "experiment", "round (one of a run's rounds)"]

["submit"]
source = "Report, \"Federated version\": \"its data scientist submits the app\" (DF4)"
why = "What the data scientist does to start a training run: the report's verb, and Flower's"
rejected = ["start", "launch", "trigger"]

["model sale"]
source = "Report, P5 \"Model sale\"; Stakeholders table: other hospitals \"May buy the model from the startup\"; DF16 \"Final model weights, if sold\""
why = "What the startup's *Download for sale* stands in for: the final model's weights and threshold, which a buyer needs to screen; never a hospital's standardization or any metrics"
rejected = ["export", "share", "release"]
