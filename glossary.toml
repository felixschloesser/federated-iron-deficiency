# The glossary: the domain's words, what each means and where it comes from.
# Model, form, template and copy use these words.
#
# The PIA report is the first source, the WHO *Laboratory Quality Management
# System Handbook* (2011, ISBN 9789241548274,
# https://www.who.int/publications/i/item/9789241548274) the second; "project
# decision" marks a word the team chose where neither has one.

["general practitioner"]
meaning = "The doctor at a practice who orders tests for patients and reads their lab reports. A practice, and so its app, has exactly one"
source = "Report, Stakeholders table (\"GP\", spelled out); one per practice: project decision"

["laboratory"]
meaning = "Where a sample goes: a hospital's laboratory the practice works with, chosen at *Collect sample*; every test on the sample follows it"
source = "Report, \"Federated version\": the practice \"sends its hospital's laboratory lab orders\"; \"the sample reaches the laboratory\""

["primary laboratory"]
meaning = "The laboratory a practice sends its samples to unless the general practitioner picks another, preselected at *Collect sample*; in the demo the paired hospital's, so lab orders follow the hospitals' sizes"
source = "Project decision (\"primary lab\"); stands for the report's single laboratory, \"Federated version\": the practice \"sends its hospital's laboratory lab orders\""

["laboratory staff"]
meaning = "The hospital's people who run the analyser on the test requests; one account each (`Role.LABORATORY_STAFF`)"
source = "WHO LQMS, the handbook's word for the people who work in the laboratory (44 uses; e.g. ch. 5, Sample management)"

["analyser"]
meaning = "The instrument that measures a sample for a test; an external system to the laboratory, simulated in the demo from NHANES participants (web/hospital/analyser/). The laboratory knows it only through measure() in web/hospital/analyser/port.py; inside the simulator, NHANES's own words (participant, SEQN) are right"
source = "Report, P9 \"Analyse samples\": \"laboratory staff run the analyser\"; DF36 \"Results: the analyser's values for each test request\""

["patient"]
meaning = "A person the general practitioner orders a test for; known by name only at the practice"
source = "Report, Use case"

["practice"]
meaning = "A general practitioner's practice, which orders tests at the hospital through its app; it has one general practitioner. The laboratory holds each sample by the practice that sent it"
source = "Report, \"Federated version\": \"Each GP practice runs its own app\"; \"Design choices and assumptions\", DF24: \"Lab orders, with the sending practice\""

["name"]
meaning = "A party's own name, which never changes: shown on its pages (`PRACTICE_NAME`, `HOSPITAL_NAME`, `STARTUP_NAME`, each set by that party's settings alone; a party they name none shows \"Demo\", which it never calls as), and the name a hospital registers a practice by (`add_practice`) and the startup a recipient hospital (`add_hospital`). A practice or a hospital calls another party as its name's slug (\"Huisartsenpraktijk De Ceder\" calls as `huisartsenpraktijk-de-ceder`), in each call's metadata; the demo believes it, and with mutual TLS the slug would be what the caller's certificate carries. A call naming no party, or one the server does not know, is refused, and so is registering a name whose slug another party has"
source = "the names in demo/compose.yaml (`PRACTICE_NAME: Huisartsenpraktijk De Akker`); Report, Solutions table, mutual TLS: \"tells practices apart by certificate name\", which the slug stands for while the demo has no certificates"

["rejection"]
meaning = "The laboratory refuses a lab order whose information is insufficient, with its reason for rejection, field by field; the practice keeps the order and its reason, never sends it again, and the general practitioner collects a new sample to order again. Adapted from the WHO's rejected sample: here the lab order is rejected before any sample reaches the laboratory"
source = "WHO LQMS 5-4, p. 66, Rejection of samples: \"insufficient patient information\"; \"Record the reason for rejection\"; \"promptly inform the authorized person\"; \"request another sample\""

["order"]
meaning = "The practice's word: what the general practitioner places, with its clinical indication. Each party speaks its own language: the practice orders, the wire carries a lab order, the laboratory works on a test request"
source = "WHO glossary *path of workflow*, \"physician's order\" (p. 228)"

["lab order"]
meaning = "What travels from the practice to the hospital (the proto's LabOrder): the sample ID, test, clinical indication, registered sex and age; no name, no values"
source = "Report, DF23 \"lab order\""

["test request"]
meaning = "The laboratory's word for what it analyses and screens: one test on a sample, received from a lab order"
source = "WHO LQMS: \"test requests\" are a laboratory input; \"the test request must be complete\" (12 uses); UZ Leuven's laboratory forms are aanvraagformulieren, request forms"

["test"]
meaning = "What an order asks the laboratory to measure: a CBC or ferritin"
source = "Report, Use case \"ferritin test\""

["CBC (complete blood count)"]
meaning = "The routine blood test the hospital screens: 13 values such as haemoglobin and red cell size"
source = "Report, Use case"

["clinical indication"]
meaning = "Why the general practitioner orders a CBC, one of the six below in the guidelines' words; the lab order names it, and the hospital decides from it whether the CBC is screened"
source = "Report, Data table"

["suspected anaemia"]
meaning = "Screened: ferritin follows only once anaemia is found (Domus S6), so a woman who is iron deficient without anaemia is missed"
source = "Domus Medica, *Aanvraag van laboratoriumtests door huisartsen*, key messages, Huisarts Nu 2012;41(4), S6: \"Bepaal Hb om de diagnose van anemie te stellen\"; NHG-Standaard Anemie 2014, H&W 57(10) p. 528: Hb for \"moeheid, duizeligheid, algemene malaise, bleekheid of hevig menstrueel bloedverlies\""

["suspected irritable bowel syndrome"]
meaning = "Screened: a CBC without ferritin"
source = "Domus Medica, *Aanvraag van laboratoriumtests door huisartsen*, key messages, Huisarts Nu 2012;41(4), S8: \"rode bloedcellen, hematocriet, hemoglobine, witte bloedcellen, sedimentatie, CRP\""

["unexplained fatigue"]
meaning = "Screened, though the guideline already adds ferritin for women of childbearing age: the suggestion helps only where ferritin was left out"
source = "Domus Medica, *Aanvraag van laboratoriumtests door huisartsen*, key messages, Huisarts Nu 2012;41(4), S8: lab tests \"wanneer de moeheid meer dan een maand aanhoudt … Bepaal ook ferritine bij vrouwen op vruchtbare leeftijd\""

["start of pregnancy"]
meaning = "Not screened: pregnancy has its own Hb rule; a past CBC ordered for it stays out of the training cohort, so the model learns only from CBCs like those it screens"
source = "Domus Medica, *Aanvraag van laboratoriumtests door huisartsen*, key messages, Huisarts Nu 2012;41(4), S9: \"Bepaal Hb, RBC en Hct … bij Hb <9,5 g/100 ml … ferritinebepaling\""

["chronic kidney disease follow-up"]
meaning = "Not screened: monitoring a known disease, whose anaemia has another cause"
source = "WOREL, *Aanvraag van laboratoriumtests (deel 1)*, 2026, p. 42: \"Bepaal minstens jaarlijks het hemoglobinegehalte … om te screenen op renale anemie\""

["other"]
meaning = "Not screened: any reason not listed above"
source = "Project decision: the guidelines are organised by indication and name no catch-all"

["screened indication"]
meaning = "A clinical indication the hospital screens a CBC for: its rule, decided at the hospital from the lab order's indication (features/hospital/screening.feature)"
source = "Report, Data table: \"the three screened indications\""

["not eligible"]
meaning = "The not-screened reason when the screening excludes a CBC (an indication not screened, not female, or not aged 18–49), never which condition (features/hospital/screening.feature)"
source = "Built from the report's Use case: the screening applies to one group, women aged 18–49 with a screened indication (features/hospital/screening.feature)"

["registered sex"]
meaning = "The sex in the patient's record, which may differ from the person's; the screening covers women"
source = "Report, Data table"

["sample ID"]
meaning = "The number on a sample's label that links its lab order, results and lab report. In the demo the patient's NHANES number and the sample's number for that patient, e.g. 135318-2"
source = "Report, DF23 and Data table"

["stored sample"]
meaning = "A sample the laboratory already holds: a later test is measured on it"
source = "WHO LQMS 5-5, p. 68, \"stored samples\""

["sample"]
meaning = "Blood collected from one patient at one time; each order is on one sample, and one sample may carry a CBC and a later ferritin"
source = "WHO LQMS ch. 5, *Sample management* (the handbook's word throughout)"

["collected"]
meaning = "When the general practitioner's practice takes the blood; recorded on the sample"
source = "WHO LQMS 5-3, p. 64: \"the health care provider may collect a sample in a clinic setting\"; 5-4, p. 66, register field \"date and time of collection\""

["analysed"]
meaning = "A test request the analyser has measured; its results are recorded"
source = "Report, P9 \"Analyse samples\""

["screening"]
meaning = "Running the deployed screening model on an analysed CBC to decide whether to suggest ferritin to the general practitioner"
source = "Report, P10 \"Screen CBC\""

["inference"]
meaning = "The training package's word for running the trained model on new blood counts (ml.inference), beside training; the hospital's word for the same step stays screening"
source = "PyTorch documentation, *Saving and Loading Models*: call model.eval() \"before running inference\""

["screening result"]
meaning = "What screening records per CBC: one of the three below, with the reason when not screened (features/hospital/screening.feature) and the screening model when screened (features/hospital/screening.feature)"
source = "Report, DF31 \"screening result\", P10"

["ferritin suggested / ferritin not suggested / not screened"]
meaning = "The three screening results: the model suggests ferritin, it does not, or the CBC was not screened (not eligible, or no usable deployed model)"
source = "Report, Use case \"a comment to the lab report suggesting ferritin\"; \"not screened\" from Federated version"

["final model"]
meaning = "The model one training run ends with, kept at the startup with its run ID; hospitals fetch it once the data scientist releases it, and validate it on their own test split"
source = "Report, DS4 \"Startup's final models\", DS5 \"Final models\""

["screening model"]
meaning = "A final model as the hospital holds it, in its `screening-models/` folder: what the laboratory director compares and deploys, named by when it arrived (\"Screening model of 30 Oct 2026, 14:02\") with its run ID as a detail"
source = "Built from the report's words: P10 *Screen CBC* and \"the model\" (Use case)"

["deploy"]
meaning = "The laboratory director's decision that a screening model screens this hospital's patients, at the threshold they choose"
source = "Report, Use case: the model \"is then deployed to every hospital\""

["deployed model"]
meaning = "The screening model this hospital deployed last; the only one that screens"
source = "Report, DF30 \"Deployed final model\""

["laboratory director"]
meaning = "The person who decides which screening model screens a hospital's patients, and who provides its training cohort; one per hospital"
source = "WHO LQMS ch. 2, p. 21: the director assesses \"all potential risks … including services to patients\" (20 uses)"

["lab record"]
meaning = "What the laboratory holds of a past patient: registered sex, age, the CBC values, the ferritin and CRP results and the clinical indication of its order; what the training cohort is extracted from. Kept apart from the test requests (DS8) and the analyser stand-in"
source = "Report, DS1 \"Lab records\"; DF1 \"Past CBC and ferritin results\""

["past patient"]
meaning = "Whom the training cohort holds a row for: an eligible woman with a complete CBC ordered for a screened indication, a ferritin and a CRP result in the lab records"
source = "Report, DF2 \"Cohort: 13 CBC values, age and label per past patient\""

["training cohort"]
meaning = "What the startup's code at this hospital trains on: the 13 CBC values, age and whether iron deficient, per past patient; nothing else. Exists only once the laboratory director provides it"
source = "Report, DS2 \"Training cohort\""

["provide"]
meaning = "The laboratory director's decision that the startup's code at this hospital may train on the training cohort; the page says it goes to that code, which runs inside the hospital"
source = "Project decision"

["withdraw"]
meaning = "The laboratory director takes the training cohort back: the startup's code at this hospital finds none from its next round, and the hospital takes no part in training until it is provided again"
source = "Project decision"

["local validation"]
meaning = "A screening model on this hospital's own test split, which no training run saw or was chosen on: the confusion matrix at each threshold from 0.05 to 0.95, as counts, then AUROC; what the laboratory director chooses a threshold from"
source = "Built from *validation* (report, DF10 \"validation example count\")"

["sensitivity"]
meaning = "Iron-deficient women of the local validation whom the screening model suggests ferritin for, shown as counts and a percentage"
source = "WHO LQMS 3-3, p. 40: test methods are \"evaluated for the ability to detect disease (sensitivity, specificity, positive and negative predictive value)\""

["95% confidence interval"]
meaning = "Beside each sensitivity, specificity and predictive value, and the AUROC here: the range it would likely fall in on other past patients like these, so the laboratory director sees how little 13 iron-deficient women pin a measure down, and that two models' AUROCs a few hundredths apart are not told apart. Shown as \"95% CI 40–89%\" and \"0.84 (95% CI 0.68–1.00)\""
source = "WHO ferritin guideline (who2020), PDF p. 38: \"95% confidence interval [CI]: 0.914–1.263\""

["specificity"]
meaning = "Women without iron deficiency whom it does not suggest ferritin for"
source = "WHO LQMS 3-3, p. 40: test methods are \"evaluated for the ability to detect disease (sensitivity, specificity, positive and negative predictive value)\""

["positive predictive value"]
meaning = "Ferritin suggestions that were right: what a suggestion is worth to the general practitioner"
source = "WHO LQMS 3-3, p. 40: test methods are \"evaluated for the ability to detect disease (sensitivity, specificity, positive and negative predictive value)\""

["negative predictive value"]
meaning = "Women without a suggestion who were not iron deficient: what a silent lab report is worth (features/practice/reports.feature)"
source = "WHO LQMS 3-3, p. 40: test methods are \"evaluated for the ability to detect disease (sensitivity, specificity, positive and negative predictive value)\""

["threshold"]
meaning = "The score above which the deployed model suggests ferritin; the laboratory director chooses it when deploying, from local validation. A final model carries none"
source = "Report, Design choices"

["messaging"]
meaning = "The hospital's endpoint for lab orders and lab reports, and the practice's side of it (web/shared/messaging/, serve_messages)"
source = "Report, P8 \"Receive lab orders\" and P12 \"Send lab reports\", the messages between practice and hospital (DF23, DF25)"

["release"]
meaning = "The data scientist's act that lets recipient hospitals fetch a final model; nothing leaves the startup before it"
source = "Report, federated version: the data scientist sees the final models \"and releases one\" (P5, DF15, DF32)"

["fetch"]
meaning = "The hospital's explicit request: a final model enters a hospital only when its laboratory director fetches new final models, through the hospital's own web app"
source = "Report, P5, DF33: \"a recipient hospital's laboratory director fetches it\"; as a practice fetches new lab reports (FetchNewLabReports)"

["recipient hospital"]
meaning = "A hospital the startup registers by its name (`add_hospital`); it may fetch every released final model"
source = "Report, federated version: \"Any hospital the startup registers is a recipient, whether or not it trained\""

["lab report"]
meaning = "What the hospital returns to the practice for one test: the results and whether ferritin is suggested"
source = "Report, DF25"

["comment"]
meaning = "The text beside a suggestion on the lab report, the only comment there is: \"Ferritin suggested by the hospital's screening of this CBC. Likely iron deficiency; not a diagnosis.\""
source = "Report, Use case; WHO report contents \"applicable comments\" (p. 193)"

["CBC value names and units, e.g. *Hemoglobin*, g/dL"]
meaning = "How the app names and measures each CBC value: NHANES's own names, in its units, with no conversion"
source = "NHANES 2021–2023 CBC_L codebook, SAS labels (https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2021/DataFiles/CBC_L.htm)"

["Ferritin, ng/mL"]
meaning = "The ferritin result, NHANES's name and unit"
source = "NHANES 2021–2023 FERTIN_L codebook (https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2021/DataFiles/FERTIN_L.htm)"

["inflammation"]
meaning = "When a past patient counts as iron deficient below 70 ng/mL instead of 15: a CRP above 5 mg/L. Ferritin rises with inflammation, so the lower cutoff would miss her"
source = "WHO ferritin guideline (who2020), recommendation 1.2, PDF p. 11: \"In individuals with infection or inflammation, a ferritin concentration below … 70 µg/L in adults\"; PDF p. 15: \"elevated inflammation (as defined by a CRP concentration >5 mg/L\""

["CRP, mg/L"]
meaning = "The lab result that says whether a past patient had inflammation; it makes the label and stays in the lab records. A past patient without one stays out of the training cohort, and the director sees how many"
source = "WHO ferritin guideline (who2020), PDF p. 29: \"C-reactive protein (CRP)\"; NHANES HSCRP codebooks (LBXHSCRP, mg/L)"

["Ferritin (made up for the demo), ng/mL"]
meaning = "A ferritin value invented for the demo where NHANES has none, so the general practitioner sees it is no measurement; it never feeds a suggestion or a label"
source = "Project decision: NHANES has no ferritin for men and women outside 12–49"

["Flower container (`flower-` prefix)"]
meaning = "A compose service that is one of Flower's components rather than a party's own app: `flower-superlink`, `flower-server-app`, `<hospital>-flower-supernode`, `<hospital>-flower-client-app`"
source = "Flower documentation, *Flower Architecture*: SuperLink, ServerApp, SuperNode, ClientApp"

["startup"]
meaning = "The company that trains the model with the hospitals and keeps the final models (DS4); its data scientist submits training runs and releases final models"
source = "Report, Stakeholders table: the startup \"Runs the SuperLink and ServerApp, writes the ClientApp and configures runs\""

["data scientist"]
meaning = "The startup's one person: submits training runs and releases final models (`Role.DATA_SCIENTIST`)"
source = "Report, training DFD, E1 \"Data scientist\"; \"its data scientist submits the app, which is based on @ironapp, and follows the run's logs (DF4, DF5)\""

["training run"]
meaning = "One federated training of the model, from the data scientist's submission to the final model the startup keeps"
source = "Report, DS4 \"Startup's final models\", one per run; DF13 \"Final model weights, per run\"; Flower documentation, `flwr run`"

["submit"]
meaning = "What the data scientist does to start a training run: the report's verb, and Flower's"
source = "Report, \"Federated version\": \"its data scientist submits the app\" (DF4)"

["run status"]
meaning = "Where a training run is, in the data scientist's own tool's words: Pending, Starting, Running, Completed, Failed, Stopped"
source = "Flower CLI, `flwr ls`: \"Current status of the run (pending, starting, running, finished)\"; a finished run is completed, failed or stopped (Flower, `flwr.common.constant.SubStatus`)"

["run configuration"]
meaning = "What the data scientist chooses when submitting, and what the startup keeps with each final model: only the training parameters, never the folder or the W&B key it also carries"
source = "Flower CLI, `flwr run --run-config`; the app's `[tool.flwr.app.config]`; report DF4 \"App, run configuration\""

["rounds"]
meaning = "How many times every hospital trains the global model and returns its weights"
source = "Flower run configuration `num-server-rounds`; report \"In each of three FedAvg rounds\""

["local epochs"]
meaning = "How many passes over its own cohort each hospital makes per round"
source = "Flower run configuration `local-epochs`; report \"every hospital trains the global model for one epoch\""

["learning rate"]
meaning = "The optimiser's step size, which the ServerApp sends every hospital each round"
source = "PyTorch `torch.optim.Adam(lr=…)`; run configuration `learning-rate`; report DF8 \"Global weights and learning rate each round\""

["weight decay"]
meaning = "The optimiser's L2 penalty on the weights, which keeps them small"
source = "PyTorch `torch.optim.Adam(weight_decay=…)`; run configuration `weight-decay`"

["batch size"]
meaning = "How many patients' records each training step averages over; the form keeps it at 32 or more, so no step is a single patient's"
source = "PyTorch `DataLoader(batch_size=…)`; run configuration `batch-size`"

["seed"]
meaning = "What makes a run's initial weights and dropout repeatable"
source = "Run configuration `model-seed` (pyproject.toml: \"Initial weights and dropout; data splits stay fixed\")"

["stop"]
meaning = "What the data scientist does to a training run in progress they no longer want, so no hospital trains for it any more"
source = "Flower CLI, `flwr stop`: \"Stop a Flower run\"; the run status Stopped"
