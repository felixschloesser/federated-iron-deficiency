# The glossary: the domain's words, each with its source, why it was chosen,
# and the words it replaces. Model, form, template and copy use these words.
#
# The PIA report is the first source, the WHO *Laboratory Quality Management
# System Handbook* (2011, ISBN 9789241548274,
# https://www.who.int/publications/i/item/9789241548274) the second. The report
# was drafted with AI help, so a word that reads badly to lab staff is replaced
# and the report's word moves to its rejected list.

["general practitioner"]
source = "Report, Stakeholders table (\"GP\", spelled out); one per practice: user decision, 2026-11-03"
why = "The report's orderer and reader of the lab report; spelled out everywhere in the app. A practice, and so its app, has exactly one"
rejected = [
    "GP (abbreviation)",
    "requester",
    "ordering physician (WHO 5-4, p. 66)",
]

["laboratory"]
source = "Report, \"Federated version\": the practice \"sends its hospital's laboratory lab orders\"; \"the sample reaches the laboratory\""
why = "Where a sample goes: a hospital's laboratory the practice works with, chosen at *Collect sample*; every test on the sample follows it"
rejected = [
    "lab (the report's short form, kept only in \"lab order\" and \"lab report\")",
    "hospital (the organisation, not where the tube goes)",
]

["primary laboratory"]
source = "User decision, 2026-11-05 (\"primary lab\"); stands for the report's single laboratory, \"Federated version\": the practice \"sends its hospital's laboratory lab orders\""
why = "The laboratory a practice sends its samples to unless the general practitioner picks another, preselected at *Collect sample*; in the demo the paired hospital's, so lab orders follow the hospitals' sizes"
rejected = [
    "default laboratory (developer word)",
    "home laboratory",
    "paired hospital (demo.toml's pairing, not a laboratory)",
    "lab (kept only in \"lab order\" and \"lab report\")",
]

["laboratory staff"]
source = "WHO LQMS, the handbook's word for the people who work in the laboratory (44 uses; e.g. ch. 5, Sample management)"
why = "Run the analyser; one record per person (`Role.LABORATORY_STAFF`)"
rejected = [
    "lab technician (\"technician\" in WHO LQMS means equipment service only)",
    "technologist (a qualified grade)",
    "laboratorian",
    "laboratory worker",
]

["analyser"]
source = "Report, P9 \"Analyse samples\": \"laboratory staff run the analyser\"; DF36 \"Results: the analyser's values for each test request\""
why = "The instrument that measures a sample for a test; an external system to the laboratory, simulated in the demo from NHANES participants (hospital/analyser/). The laboratory knows it only through measure() in hospital/analyser/port.py; inside the simulator, NHANES's own words (participant, SEQN) are right"
rejected = [
    "nhanes (the demo data's origin, not what the app is)",
    "instrument (WHO LQMS's general word; the report says analyser)",
    "stand-in (says how it is built, not what it is)",
    "tube (the glossary's rejected word for the container)",
]

["patient"]
source = "Report, Use case"
why = "The report's word"
rejected = ["participant (NHANES word; data origin only)"]

["practice"]
source = "Report, \"Federated version\": \"Each GP practice runs its own app\"; \"Design choices and assumptions\", DF24: \"Lab orders, with the sending practice\""
why = "Who orders at the hospital: a general practitioner's practice, through its app, with one general practitioner (features/practice/access.feature). The lab holds each sample by its practice"
rejected = [
    "client (WHO 13-2; the code's word until 2026-11-03)",
    "sender",
    "requester",
]

["certificate name"]
source = "Report, Solutions table, mutual TLS: \"each hospital is its own CA and tells practices apart by certificate name\"; \"the startup is its own CA and tells recipient hospitals apart by certificate name\""
why = "The name a serving party issued its client and registers it by: a hospital its practices (`add_practice`, `PRACTICE_CERTIFICATE_NAME`), the startup its recipient hospitals (`add_hospital`, `HOSPITAL_CERTIFICATE_NAME`). Sent in every request; the demo trusts it as sent, with mutual TLS it would come from the client's certificate. A name the server does not know is refused"
rejected = [
    "practice ID (no source)",
    "hospital ID (no source)",
    "client ID (OAuth's word)",
    "RIZIV/INAMI number (identifies a doctor, not a practice)",
]

["practice name"]
source = "Report, \"Design choices and assumptions\", DF24: \"Lab orders, with the sending practice\"; the names in demo.toml (`practice = \"Huisartsenpraktijk De Akker\"`)"
why = "The practice's own name (`PARTY_NAME`), shown on its pages; the hospital registers it beside the certificate name, which is the lab's key, and it is never sent"
rejected = [
    "client name",
]

["order"]
source = "WHO glossary *path of workflow*, \"physician's order\" (p. 228)"
why = "The practice's word: what the general practitioner places, with its clinical indication, which never leaves the practice. Each party speaks its own language: the practice orders, the wire carries a lab order, the laboratory works on a test request"
rejected = ["request (the laboratory's word)", "requisition (WHO)", "examination request (ISO 15189)"]

["lab order"]
source = "Report, DF23 \"lab order\""
why = "What travels from the practice to the hospital (the proto's LabOrder): only whether the indication is screened, never which; send_lab_order makes one of an order"
rejected = ["order (the practice's)", "test request (the laboratory's)"]

["test request"]
source = "WHO LQMS: \"test requests\" are a laboratory input; \"the test request must be complete\" (12 uses); UZ Leuven's laboratory forms are aanvraagformulieren, request forms"
why = "The laboratory's word for what it analyses and screens: one test on a sample, received from a lab order"
rejected = ["lab order (the message it arrives as)", "order (US and HL7 usage)", "requisition (WHO: the paper form)", "examination request (ISO 15189)"]

["test"]
source = "Report, Use case \"ferritin test\""
why = "Order picks one: CBC or ferritin"
rejected = ["examination (ISO 15189)"]

["CBC (complete blood count)"]
source = "Report, Use case"
why = "The report's word for the routine test"
rejected = ["blood count (report uses both; one word only)"]

["clinical indication"]
source = "Report, Data table"
why = "The report's word; decides screening (features/hospital/screening.feature). One of the six below, in the guidelines' words"
rejected = ["reason for testing"]

["suspected anaemia"]
source = "Domus Medica, *Aanvraag van laboratoriumtests door huisartsen*, key messages, Huisarts Nu 2012;41(4), S6: \"Bepaal Hb om de diagnose van anemie te stellen\"; NHG-Standaard Anemie 2014, H&W 57(10) p. 528: Hb for \"moeheid, duizeligheid, algemene malaise, bleekheid of hevig menstrueel bloedverlies\""
why = "Screened: ferritin follows only once anaemia is found (Domus S6), so a woman who is iron deficient without anaemia is missed"
rejected = ["anaemia work-up"]

["suspected irritable bowel syndrome"]
source = "Domus Medica, *Aanvraag van laboratoriumtests door huisartsen*, key messages, Huisarts Nu 2012;41(4), S8: \"rode bloedcellen, hematocriet, hemoglobine, witte bloedcellen, sedimentatie, CRP\""
why = "Screened: a CBC without ferritin"
rejected = ["IBS (abbreviation)"]

["unexplained fatigue"]
source = "Domus Medica, *Aanvraag van laboratoriumtests door huisartsen*, key messages, Huisarts Nu 2012;41(4), S8: lab tests \"wanneer de moeheid meer dan een maand aanhoudt … Bepaal ook ferritine bij vrouwen op vruchtbare leeftijd\""
why = "Screened, though the guideline already adds ferritin for women of childbearing age: the suggestion helps only where ferritin was left out"
rejected = [
    "non-specific complaint (no source; the report's earlier word)",
    "fatigue work-up",
]

["start of pregnancy"]
source = "Domus Medica, *Aanvraag van laboratoriumtests door huisartsen*, key messages, Huisarts Nu 2012;41(4), S9: \"Bepaal Hb, RBC en Hct … bij Hb <9,5 g/100 ml … ferritinebepaling\""
why = "Not screened: pregnancy has its own Hb rule, and the cohort was not checked for pregnancy"
rejected = ["pregnancy check"]

["chronic kidney disease follow-up"]
source = "WOREL, *Aanvraag van laboratoriumtests (deel 1)*, 2026, p. 42: \"Bepaal minstens jaarlijks het hemoglobinegehalte … om te screenen op renale anemie\""
why = "Not screened: monitoring a known disease, whose anaemia has another cause"
rejected = ["CKD (abbreviation)"]

["other"]
source = "User decision, 2026-11-01: the guidelines are organised by indication and name no catch-all"
why = "Not screened"
rejected = []

["screened indication"]
source = "Report, Data table: \"the three screened indications\""
why = "All the lab order says of the clinical indication: whether it is one the screening covers (features/hospital/screening.feature, features/hospital/messaging.feature), never which"
rejected = [
    "screen requested (the general practitioner requests nothing)",
    "eligible (also sex and age)",
]

["not eligible"]
source = "Built from the report's Use case: the screening applies to one group, women aged 18–49 with a screened indication (features/hospital/screening.feature)"
why = "The not-screened reason when the screening excludes a CBC (an indication not screened, not female, or not aged 18–49), never which condition (features/hospital/screening.feature)"
rejected = ["not screened because of indication", "sex or age"]

["registered sex"]
source = "Report, Data table"
why = "Distinguishes the record from the person (report, Information at risk)"
rejected = ["gender", "sex"]

["sample ID"]
source = "Report, DF23 and Data table"
why = "The report's link between lab order, results and lab report; on the sample's label. In the demo the patient's NHANES number and the sample's number for that patient, e.g. 135318-2"
rejected = [
    "laboratory identification number",
    "accession number (WHO 5-4, p. 66)",
]

["stored sample"]
source = "WHO LQMS 5-5, p. 68, \"stored samples\""
why = "A sample the laboratory already holds: a later test is measured on it"
