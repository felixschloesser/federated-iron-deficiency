["collected"]
source = "WHO LQMS 5-3, p. 64: \"the health care provider may collect a sample in a clinic setting\"; 5-4, p. 66, register field \"date and time of collection\""
why = "When the general practitioner's practice takes the blood; recorded on the sample"
