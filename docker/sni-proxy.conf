# Routes each <party>.localhost to that party's web app by the name in the TLS
# handshake (SNI), passing the encrypted bytes through: like the internet
# between a browser and six organisations, it sees names, never content.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {}

stream {
    # Docker's own DNS, asked at connection time: a restarted web app is found again.
    resolver 127.0.0.11 valid=10s;

    map $ssl_preread_server_name $web_app {
        uz-leuven.localhost                    uz-leuven-web:8000;
        heilig-hart-leuven.localhost           heilig-hart-leuven-web:8000;
        az-diest.localhost                     az-diest-web:8000;
        huisartsenpraktijk-de-akker.localhost  huisartsenpraktijk-de-akker-web:8000;
        huisartsenpraktijk-de-berk.localhost   huisartsenpraktijk-de-berk-web:8000;
        huisartsenpraktijk-de-ceder.localhost  huisartsenpraktijk-de-ceder-web:8000;
        # Any other name reaches no web app: nginx closes the connection.
        default                                127.0.0.1:1;
    }

    server {
        listen 8443;
        ssl_preread on;
        proxy_pass $web_app;
    }
}
