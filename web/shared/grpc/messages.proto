// Messages between the general practitioner's app and the hospital
// (tests/hospital/test_grpc_server.py), and between a hospital's web app and the
// startup (features/startup/release.feature). The client is always the one that
// asks, the practice or the hospital. No message says who sent it: the client
// names its party by its name's slug in each call's metadata
// (web/shared/grpc/identity.py), where mutual TLS would take it from the
// client's certificate; the demo leaves that out.
//
// Every message is complete or refused: each part is required, and every
// receiver parses what it receives into its own models, which refuse one that
// left a part out. Presence is implicit, so a zero is not sent and reads as
// missing; a part whose zero is a value (age 0) has explicit presence instead.
// Lists may be empty.
edition = "2024";

package iron_deficiency.v1;

import "google/protobuf/timestamp.proto";

option features.field_presence = IMPLICIT;

// The choices of web.shared.vocabulary, one value per member, named after it with the
// enum's prefix (Test.CBC is TEST_CBC); 0 is none, never sent.
enum Test {
  TEST_UNSPECIFIED = 0;
  TEST_CBC = 1;
  TEST_FERRITIN = 2;
}

enum ClinicalIndication {
  CLINICAL_INDICATION_UNSPECIFIED = 0;
  CLINICAL_INDICATION_SUSPECTED_ANAEMIA = 1;
  CLINICAL_INDICATION_SUSPECTED_IBS = 2;
  CLINICAL_INDICATION_UNEXPLAINED_FATIGUE = 3;
  CLINICAL_INDICATION_START_OF_PREGNANCY = 4;
  CLINICAL_INDICATION_CKD_FOLLOW_UP = 5;
  CLINICAL_INDICATION_OTHER = 6;
}

enum RegisteredSex {
  REGISTERED_SEX_UNSPECIFIED = 0;
  REGISTERED_SEX_FEMALE = 1;
  REGISTERED_SEX_MALE = 2;
}

// DF23. No patient name, no blood values (tests/quality/privacy/test_messages.py): the
// tube's values are measured at the hospital. The clinical indication is one of
// the choices, from which the laboratory decides whether to screen
// (features/hospital/screening.feature).
message LabOrder {
  string sample_id = 1;
  Test test = 2;
  // The one part a message may leave out: ferritin takes none, and a CBC
  // without one is not screened.
  ClinicalIndication clinical_indication = 3;
  RegisteredSex registered_sex = 4;
  uint32 age = 5 [features.field_presence = EXPLICIT];
  google.protobuf.Timestamp ordered_at = 6;
}

enum ResultName {
  RESULT_NAME_UNSPECIFIED = 0;
  RESULT_NAME_WHITE_BLOOD_CELL_COUNT = 1;
  RESULT_NAME_RED_BLOOD_CELL_COUNT = 2;
  RESULT_NAME_HEMOGLOBIN = 3;
  RESULT_NAME_HEMATOCRIT = 4;
  RESULT_NAME_MEAN_CELL_VOLUME = 5;
  RESULT_NAME_MEAN_CELL_HEMOGLOBIN_CONCENTRATION = 6;
  RESULT_NAME_MEAN_CELL_HEMOGLOBIN = 7;
  RESULT_NAME_RED_CELL_DISTRIBUTION_WIDTH = 8;
  RESULT_NAME_PLATELET_COUNT = 9;
  RESULT_NAME_MEAN_PLATELET_VOLUME = 10;
  RESULT_NAME_LYMPHOCYTE_NUMBER = 11;
  RESULT_NAME_SEGMENTED_NEUTROPHILS_NUMBER = 12;
  RESULT_NAME_MONOCYTE_NUMBER = 13;
  RESULT_NAME_FERRITIN = 14;
  RESULT_NAME_MADE_UP_FERRITIN = 15;
}

// One measured value, under its name, in the unit the name fixes
// (web.shared.vocabulary.ResultName.unit). A value of 0 is a value.
message Result {
  ResultName name = 1;
  double value = 2 [features.field_presence = EXPLICIT];
}

// DF25. Results and one bit of screening (features/practice/reports.feature, tests/quality/privacy/test_messages.py): no score, and nothing that
// tells ferritin not suggested from not screened.
message LabReport {
  uint64 report_id = 1;
  string sample_id = 2;
  Test test = 3;
  repeated Result results = 4;  // empty when NHANES lacks the values
  google.protobuf.Timestamp released_at = 5;
  bool ferritin_suggested = 6 [features.field_presence = EXPLICIT];
}

// Each call has a request and a response of its own (tests/shared/test_messages.py),
// so one call can gain a part without another.
message SendLabOrderRequest {
  LabOrder lab_order = 1;
}

message SendLabOrderResponse {}

message FetchNewLabReportsRequest {}

message FetchNewLabReportsResponse {
  repeated LabReport lab_reports = 1;
}

// The lab reports the practice received, stored or not: the laboratory sends
// them no more.
message AcknowledgeLabReportsRequest {
  repeated uint64 report_ids = 1;
}

message AcknowledgeLabReportsResponse {}

service Laboratory {
  rpc SendLabOrder(SendLabOrderRequest) returns (SendLabOrderResponse);
  rpc FetchNewLabReports(FetchNewLabReportsRequest) returns (FetchNewLabReportsResponse);
  rpc AcknowledgeLabReports(AcknowledgeLabReportsRequest) returns (AcknowledgeLabReportsResponse);
}

// A released final model as it reaches a recipient hospital, a screening model
// (DF37): its weights (a saved state dict), the AUROC across hospitals, and its
// training run's ID; never its run configuration.
message ScreeningModel {
  uint64 run_id = 1;
  bytes weights = 2;
  double federated_auroc = 3 [features.field_presence = EXPLICIT];
}

// What the hospital holds, so the startup sends only the rest: a screening
// model it failed to store is sent again, one it holds other weights for is not.
message FetchNewScreeningModelsRequest {
  repeated uint64 held_run_ids = 1;
}

message FetchNewScreeningModelsResponse {
  repeated ScreeningModel screening_models = 1;
}

service ScreeningModels {
  rpc FetchNewScreeningModels(FetchNewScreeningModelsRequest) returns (FetchNewScreeningModelsResponse);
}
