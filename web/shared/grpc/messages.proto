// Messages between the general practitioner's app and the hospital, and between
// a hospital and the startup. The client is always the party that asks: the
// practice or the hospital. No message says who sent it: the client puts its
// name's slug in each call's metadata (web/shared/grpc/identity.py). With mutual
// TLS, which the demo leaves out, the server would take the name from the
// client's certificate instead.
//
// Every part is required unless its comment says otherwise: each receiver parses
// what it receives into its own models, which refuse a message with a part
// missing. Presence is implicit, so a zero value is not sent and reads as
// missing; a part whose zero is a real value (age 0) has explicit presence
// instead. Lists may be empty.
edition = "2024";

package iron_deficiency.v1;

import "google/protobuf/timestamp.proto";

option features.field_presence = IMPLICIT;

// Each enum mirrors a choices class in web.shared.vocabulary: one value per
// member, named after it with the enum's prefix (Test.CBC is TEST_CBC). 0 means
// none and is never sent.
enum Test {
  TEST_UNSPECIFIED = 0;
  TEST_CBC = 1;
  TEST_FERRITIN = 2;
}

enum ClinicalIndication {
  CLINICAL_INDICATION_UNSPECIFIED = 0;
  CLINICAL_INDICATION_SUSPECTED_ANAEMIA = 1;
  CLINICAL_INDICATION_SUSPECTED_IBS = 2;
  CLINICAL_INDICATION_UNEXPLAINED_FATIGUE = 3;
  CLINICAL_INDICATION_START_OF_PREGNANCY = 4;
  CLINICAL_INDICATION_CKD_FOLLOW_UP = 5;
  CLINICAL_INDICATION_OTHER = 6;
}

enum RegisteredSex {
  REGISTERED_SEX_UNSPECIFIED = 0;
  REGISTERED_SEX_FEMALE = 1;
  REGISTERED_SEX_MALE = 2;
}

// The lab order, practice → hospital. It carries no patient name and no
// blood values: the sample's values are measured at the hospital. From the
// clinical indication, the laboratory decides whether to screen a CBC.
message LabOrder {
  string sample_id = 1;
  Test test = 2;
  // The one part that may be left out: a ferritin order has none, and a CBC
  // without one is not screened.
  ClinicalIndication clinical_indication = 3;
  RegisteredSex registered_sex = 4;
  uint32 age = 5 [features.field_presence = EXPLICIT];
  google.protobuf.Timestamp ordered_at = 6;
}

enum ResultName {
  RESULT_NAME_UNSPECIFIED = 0;
  RESULT_NAME_WHITE_BLOOD_CELL_COUNT = 1;
  RESULT_NAME_RED_BLOOD_CELL_COUNT = 2;
  RESULT_NAME_HEMOGLOBIN = 3;
  RESULT_NAME_HEMATOCRIT = 4;
  RESULT_NAME_MEAN_CELL_VOLUME = 5;
  RESULT_NAME_MEAN_CELL_HEMOGLOBIN_CONCENTRATION = 6;
  RESULT_NAME_MEAN_CELL_HEMOGLOBIN = 7;
  RESULT_NAME_RED_CELL_DISTRIBUTION_WIDTH = 8;
  RESULT_NAME_PLATELET_COUNT = 9;
  RESULT_NAME_MEAN_PLATELET_VOLUME = 10;
  RESULT_NAME_LYMPHOCYTE_NUMBER = 11;
  RESULT_NAME_SEGMENTED_NEUTROPHILS_NUMBER = 12;
  RESULT_NAME_MONOCYTE_NUMBER = 13;
  RESULT_NAME_FERRITIN = 14;
}

// One measured value, in the unit its name fixes
// (web.shared.vocabulary.ResultName.unit). 0 is a real value, so presence is
// explicit.
message Result {
  ResultName name = 1;
  double value = 2 [features.field_presence = EXPLICIT];
}

// The lab report, hospital → practice: the results and one bit of
// screening. It carries no score, and does not tell "ferritin not suggested"
// apart from "not screened". The practice matches a lab report to its order,
// and acknowledges it, by sample ID and test.
message LabReport {
  string sample_id = 1;
  Test test = 2;
  // Each result name at most once; empty when NHANES lacks the values.
  repeated Result results = 3;
  google.protobuf.Timestamp released_at = 4;
  bool ferritin_suggested = 5 [features.field_presence = EXPLICIT];
}

// Names a lab report the practice received, by its sample ID and test, whether
// or not the practice stored it.
message Acknowledgement {
  string sample_id = 1;
  Test test = 2;
}

// Each call has its own request and response message, so one call can gain a
// part without changing another.
message SendLabOrderRequest {
  LabOrder lab_order = 1;
}

message SendLabOrderResponse {}

message FetchNewLabReportsRequest {}

message FetchNewLabReportsResponse {
  repeated LabReport lab_reports = 1;
}

// The lab reports the practice received, each once; the laboratory then sends
// them no more.
message AcknowledgeLabReportsRequest {
  repeated Acknowledgement acknowledgements = 1;
}

message AcknowledgeLabReportsResponse {}

service Laboratory {
  rpc SendLabOrder(SendLabOrderRequest) returns (SendLabOrderResponse);
  rpc FetchNewLabReports(FetchNewLabReportsRequest) returns (FetchNewLabReportsResponse);
  rpc AcknowledgeLabReports(AcknowledgeLabReportsRequest) returns (AcknowledgeLabReportsResponse);
}

// The screening model, startup → hospital: a released final model as a
// recipient hospital receives it. It carries its weights (a saved state dict),
// the AUROC across hospitals and its training run's ID, never its run
// configuration.
message ScreeningModel {
  uint64 run_id = 1;
  bytes weights = 2;
  double federated_auroc = 3 [features.field_presence = EXPLICIT];
}

// The training runs whose screening models the hospital already holds, so the
// startup sends only the others. A screening model the hospital failed to store
// is sent again; one it holds, even with other weights, is not.
message FetchNewScreeningModelsRequest {
  repeated uint64 held_run_ids = 1;  // each once
}

message FetchNewScreeningModelsResponse {
  repeated ScreeningModel screening_models = 1;
}

service ScreeningModels {
  rpc FetchNewScreeningModels(FetchNewScreeningModelsRequest) returns (FetchNewScreeningModelsResponse);
}
