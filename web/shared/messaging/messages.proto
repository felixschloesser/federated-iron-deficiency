// Messages between the general practitioner's app and the hospital
// (tests/hospital/test_messaging.py), and between a hospital's web app and the
// startup (features/startup/release.feature). The client is always the one that
// asks, the practice or the hospital. No message says who sent it: the client
// names its party by its name's slug in each call's metadata
// (web/shared/messaging/identity.py), where mutual TLS would take it from the
// client's certificate; the demo leaves that out.
//
// Every message is complete or refused (tests/shared/test_messages.py): each part
// is required (protovalidate, buf/validate/validate.proto), and every receiver
// validates what it receives before reading it. Presence is implicit, so a zero
// is not sent and "required" refuses it; a part whose zero is a value (age 0)
// has explicit presence instead. Lists may be empty.
edition = "2024";

package messaging.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option features.field_presence = IMPLICIT;

// The choices of web.shared.vocabulary, one value per member, named after it with the
// enum's prefix (Test.CBC is TEST_CBC); 0 is none, never sent. Each enum part
// takes only the values its enum names.
enum Test {
  TEST_UNSPECIFIED = 0;
  TEST_CBC = 1;
  TEST_FERRITIN = 2;
}

enum ClinicalIndication {
  CLINICAL_INDICATION_UNSPECIFIED = 0;
  CLINICAL_INDICATION_SUSPECTED_ANAEMIA = 1;
  CLINICAL_INDICATION_SUSPECTED_IBS = 2;
  CLINICAL_INDICATION_UNEXPLAINED_FATIGUE = 3;
  CLINICAL_INDICATION_START_OF_PREGNANCY = 4;
  CLINICAL_INDICATION_CKD_FOLLOW_UP = 5;
  CLINICAL_INDICATION_OTHER = 6;
}

enum RegisteredSex {
  REGISTERED_SEX_UNSPECIFIED = 0;
  REGISTERED_SEX_FEMALE = 1;
  REGISTERED_SEX_MALE = 2;
}

// DF23. No patient name, no blood values (tests/quality/privacy/test_messages.py): the
// tube's values are measured at the hospital. The clinical indication is one of
// the choices, from which the laboratory decides whether to screen
// (features/hospital/screening.feature).
message LabOrder {
  string sample_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 20
  ];
  Test test = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // The one part a message may leave out: ferritin takes none, and a CBC
  // without one is not screened.
  ClinicalIndication clinical_indication = 3 [(buf.validate.field).enum.defined_only = true];
  RegisteredSex registered_sex = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  uint32 age = 5 [
    features.field_presence = EXPLICIT,
    (buf.validate.field).required = true
  ];
  google.protobuf.Timestamp ordered_at = 6 [(buf.validate.field).required = true];
}

// DF25. Results and one bit of screening (features/practice/reports.feature, tests/quality/privacy/test_messages.py): no score, and nothing that
// tells ferritin not suggested from not screened.
message LabReport {
  uint64 report_id = 1 [(buf.validate.field).required = true];
  string sample_id = 2 [(buf.validate.field).required = true];
  Test test = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  map<string, double> results = 4;  // empty when NHANES lacks the value
  google.protobuf.Timestamp released_at = 5 [(buf.validate.field).required = true];
  bool ferritin_suggested = 6 [
    features.field_presence = EXPLICIT,
    (buf.validate.field).required = true
  ];
}

message LabReports {
  repeated LabReport reports = 1;
}

message Acknowledgement {
  repeated uint64 report_ids = 1;
}

service Laboratory {
  rpc SendLabOrder(LabOrder) returns (google.protobuf.Empty);
  rpc FetchNewLabReports(google.protobuf.Empty) returns (LabReports);
  rpc AcknowledgeLabReports(Acknowledgement) returns (google.protobuf.Empty);
}

// A released final model as a recipient hospital fetches it (DF37): its weights
// (a saved state dict), the AUROC across hospitals, and its training run's ID;
// never its run configuration.
message FinalModel {
  uint64 run_id = 1 [(buf.validate.field).required = true];
  bytes weights = 2 [(buf.validate.field).required = true];
  double federated_auroc = 3 [
    features.field_presence = EXPLICIT,
    (buf.validate.field).required = true,
    (buf.validate.field).double = {gte: 0, lte: 1}
  ];
}

message NewFinalModels {
  repeated FinalModel final_models = 1;
}

// What the hospital holds, so the startup sends only the rest: a final model
// it failed to store is sent again, one it holds other weights for is not.
message NewFinalModelsRequest {
  repeated uint64 held_run_ids = 1;
}

service FinalModels {
  rpc FetchNewFinalModels(NewFinalModelsRequest) returns (NewFinalModels);
}
