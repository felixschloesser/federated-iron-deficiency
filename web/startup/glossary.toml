# The startup's words (sources: web/shared/glossary.toml's header).

["release"]
meaning = "The data scientist's act that lets recipient hospitals fetch a final model; nothing leaves the startup before it"
source = "Report, federated version: the data scientist sees the final models \"and releases one\" (P5, DF15, DF32)"

["recipient hospital"]
meaning = "A hospital the startup registers by its name (`add_hospital`); it may fetch every released final model"
source = "Report, federated version: \"Any hospital the startup registers is a recipient, whether or not it trained\""

["data scientist"]
meaning = "The startup's one person: submits training runs and releases final models (`Role.DATA_SCIENTIST`)"
source = "Report, training DFD, E1 \"Data scientist\"; \"its data scientist submits the app, which is based on @ironapp, and follows the run's logs (DF4, DF5)\""

["training run"]
meaning = "One federated training of the model, from the data scientist's submission to the final model the startup keeps"
source = "Report, DS4 \"Startup's final models\", one per run; DF13 \"Final model weights, per run\"; Flower documentation, `flwr run`"

["submit"]
meaning = "What the data scientist does to start a training run: the report's verb, and Flower's"
source = "Report, \"Federated version\": \"its data scientist submits the app\" (DF4)"

["run status"]
meaning = "Where a training run is, in the data scientist's own tool's words: Pending, Starting, Running, Completed, Failed, Stopped"
source = "Flower CLI, `flwr ls`: \"Current status of the run (pending, starting, running, finished)\"; a finished run is completed, failed or stopped (Flower, `flwr.common.constant.SubStatus`)"

["run configuration"]
meaning = "What the data scientist chooses when submitting, and what the startup keeps with each final model: only the training parameters, never the folder or the W&B key it also carries"
source = "Flower CLI, `flwr run --run-config`; the app's `[tool.flwr.app.config]`; report DF4 \"App, run configuration\""

["rounds"]
meaning = "How many times every hospital trains the global model and returns its weights"
source = "Flower run configuration `num-server-rounds`; report \"In each of three FedAvg rounds\""

["local epochs"]
meaning = "How many passes over its own cohort each hospital makes per round"
source = "Flower run configuration `local-epochs`; report \"every hospital trains the global model for one epoch\""

["learning rate"]
meaning = "The optimiser's step size, which the ServerApp sends every hospital each round"
source = "PyTorch `torch.optim.Adam(lr=…)`; run configuration `learning-rate`; report DF8 \"Global weights and learning rate each round\""

["weight decay"]
meaning = "The optimiser's L2 penalty on the weights, which keeps them small"
source = "PyTorch `torch.optim.Adam(weight_decay=…)`; run configuration `weight-decay`"

["batch size"]
meaning = "How many patients' records each training step averages over; the form keeps it at 32 or more, so no step is a single patient's"
source = "PyTorch `DataLoader(batch_size=…)`; run configuration `batch-size`"

["seed"]
meaning = "What makes a run's initial weights and dropout repeatable"
source = "Run configuration `model-seed` (pyproject.toml: \"Initial weights and dropout; data splits stay fixed\")"

["stop"]
meaning = "What the data scientist does to a training run in progress they no longer want, so no hospital trains for it any more"
source = "Flower CLI, `flwr stop`: \"Stop a Flower run\"; the run status Stopped"
