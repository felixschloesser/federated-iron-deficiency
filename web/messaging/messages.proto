// Messages between the general practitioner's app and the hospital (spec §10).
// The general practitioner's app is always the client (R23); the hospital
// accepts only a client certificate from its own authority (R24).
syntax = "proto3";

package iron_deficiency.messaging.v1;

import "google/protobuf/timestamp.proto";

// The choices of web.vocabulary, one value per member, named after it with the
// enum's prefix (Test.CBC is TEST_CBC); 0 is none (proto3 default).
enum Test {
  TEST_UNSPECIFIED = 0;
  TEST_CBC = 1;
  TEST_FERRITIN = 2;
}

enum ClinicalIndication {
  CLINICAL_INDICATION_UNSPECIFIED = 0;  // none: a test that takes no indication
  CLINICAL_INDICATION_SUSPECTED_ANAEMIA = 1;
  CLINICAL_INDICATION_SUSPECTED_IBS = 2;
  CLINICAL_INDICATION_UNEXPLAINED_FATIGUE = 3;
  CLINICAL_INDICATION_START_OF_PREGNANCY = 4;
  CLINICAL_INDICATION_CKD_FOLLOW_UP = 5;
  CLINICAL_INDICATION_OTHER = 6;
}

enum RegisteredSex {
  REGISTERED_SEX_UNSPECIFIED = 0;
  REGISTERED_SEX_FEMALE = 1;
  REGISTERED_SEX_MALE = 2;
}

// DF23. No patient name, no blood values (R25): the tube's values are measured
// at the hospital. The hospital's form still checks every field.
message LabOrder {
  reserved 2, 3, 4, 7;              // were strings: test, indication, sex, ordered_at
  string sample_id = 1;
  Test test = 8;
  ClinicalIndication indication = 9;
  RegisteredSex registered_sex = 10;
  uint32 age = 5;
  string general_practitioner = 6;  // the ordering general practitioner's name
  google.protobuf.Timestamp ordered_at = 11;
}

// DF25. Results and one bit of screening (R9, R25): no score, and nothing that
// tells ferritin not suggested from not screened.
message LabReport {
  reserved 3, 6;                    // were strings: test, released_at
  reserved 5;                       // was the free-text comment
  reserved "comment";
  string report_id = 1;
  string sample_id = 2;
  Test test = 8;
  map<string, double> results = 4;
  google.protobuf.Timestamp released_at = 9;
  bool ferritin_suggested = 7;      // false when absent: never a false suggestion
}

message Received {}

message FetchLabReports {}

message LabReports {
  repeated LabReport reports = 1;
}

message Acknowledgement {
  repeated string report_ids = 1;
}

service Laboratory {
  rpc SendLabOrder(LabOrder) returns (Received);
  rpc FetchNewLabReports(FetchLabReports) returns (LabReports);
  rpc AcknowledgeLabReports(Acknowledgement) returns (Received);
}
