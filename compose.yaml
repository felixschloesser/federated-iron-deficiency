# The demo deployment (spec §9): one container per service, one network per
# trust boundary of the report's DFDs, and one per crossing. Every container
# mounts only its own parts of demo/, at the same path as on the host.
#
#   docker compose up --build --abort-on-container-failure
#   docker compose run --rm train
#   docker compose run --rm reset
#
# Browsers reach https://<party>.localhost through the proxy, the only
# published port. Networks: startup (TB2), <hospital> (TB1), <hospital>-clientapp (TB4,
# internal), <practice> (TB3); model-updates crosses TB2-TB1 (DF7-DF10),
# <hospital>-lab-orders crosses TB3-TB1 (DF23, DF25).

name: iron-deficiency

# Each image is built once, by the first service that names it (prepare,
# serverapp); every other service uses it as built.
# Every container runs as one user, so on Linux, where a bind mount keeps
# numeric IDs, demo/ never mixes the images' own users (49999, 1000). Set
# DEMO_USER=$(id -u):$(id -g) in .env if your account is not 1000:1000.
x-user: &user "${DEMO_USER:-1000:1000}"

x-web: &web
  image: iron-deficiency-web
  user: *user
  depends_on:
    prepare: {condition: service_completed_successfully}

x-superexec: &superexec
  image: iron-deficiency-superexec
  user: *user

x-supernode: &supernode
  image: flwr/supernode:1.40.0
  user: *user
  environment:
    FLWR_HOME: /tmp/flwr
  depends_on:
    register: {condition: service_completed_successfully}

services:
  # Out-of-band setup, not drawn in the DFDs: certificates, keys, cohorts,
  # databases. The one container that sees every party's folder.
  prepare:
    <<: *web
    build: {context: ., dockerfile: docker/web.Dockerfile}
    depends_on: {}
    command: [python, tools/demo.py, prepare, --demo-dir, /demo]
    environment:
      # Hugging Face may refuse unauthenticated downloads of the cohorts.
      HF_TOKEN: ${HF_TOKEN:-}
      # Only for the summary's addresses.
      DEMO_HTTPS_PORT: ${DEMO_HTTPS_PORT:-443}
    volumes: [./demo:/demo]
    networks: [setup]

  # Setup too: `docker compose run --rm reset`, with the demo stopped, deletes
  # every party's web database, so the next `up` seeds them afresh.
  reset:
    <<: *web
    profiles: [reset]
    depends_on: {}
    command: [python, tools/demo.py, reset, --demo-dir, /demo]
    volumes: [./demo:/demo]
    network_mode: none

  # TB2, the startup.
  superlink:
    image: flwr/superlink:1.40.0
    user: *user
    environment:
      FLWR_HOME: /tmp/flwr
    depends_on:
      prepare: {condition: service_completed_successfully}
    command:
      - --host=0.0.0.0
      - --port=9092
      - --database=/demo/startup/superlink/state.db
      - --isolation=process
      # Only SuperNodes registered by `register` get in (R27).
      - --enable-supernode-auth
      - --ssl-ca-certfile=/demo/startup/certificates/ca.crt
      - --ssl-certfile=/demo/startup/certificates/superlink/certificate.pem
      - --ssl-keyfile=/demo/startup/certificates/superlink/key.pem
    volumes:
      - ./demo/startup/superlink:/demo/startup/superlink
      - ./demo/startup/certificates:/demo/startup/certificates:ro
    networks: [startup, model-updates]
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('localhost', 9092))"]
      interval: 2s
      retries: 30

  serverapp:
    <<: *superexec
    build: {context: ., dockerfile: docker/superexec.Dockerfile}
    depends_on:
      superlink: {condition: service_healthy}
    command:
      - --runtime-api-address=superlink:9092
      - --root-certificates=/demo/startup/trust/ca.crt
    volumes:
      - ./demo/startup/trust:/demo/startup/trust:ro
      - ./demo/startup/final-models:/demo/startup/final-models
    networks: [startup]

  register:
    <<: *web
    depends_on:
      superlink: {condition: service_healthy}
    command: [python, tools/demo.py, register, --demo-dir, /demo]
    volumes:
      - ./demo/startup/supernodes:/demo/startup/supernodes:ro
      - ./demo/startup/flwr-home:/demo/startup/flwr-home
      - ./demo/startup/trust:/demo/startup/trust:ro
    networks: [startup]

  # E1, the data scientist, submits from inside TB2: `docker compose run --rm train`.
  train:
    <<: *web
    profiles: [train]
    depends_on:
      superlink: {condition: service_healthy}
    command: [flwr, run, /app, demo, --run-config, "demo-dir='/demo'", --stream]
    environment:
      FLWR_HOME: /demo/startup/flwr-home
    volumes:
      - ./demo/startup/flwr-home:/demo/startup/flwr-home
      - ./demo/startup/trust:/demo/startup/trust:ro
    networks: [startup]

  # TB1 and TB4, UZ Leuven.
  uz-leuven-supernode:
    <<: *supernode
    command:
      - --superlink=superlink:9092
      - --root-certificates=/demo/hospitals/uz-leuven/certificates/ca.crt
      - --auth-supernode-private-key=/demo/hospitals/uz-leuven/supernode/key
      - --isolation=process
      - --host=0.0.0.0
      - --port=9094
      - --node-config=data-path='/demo/hospitals/uz-leuven/cohort' final-models-path='/demo/hospitals/uz-leuven/final-models'
    volumes:
      - ./demo/hospitals/uz-leuven/certificates:/demo/hospitals/uz-leuven/certificates:ro
      - ./demo/hospitals/uz-leuven/supernode:/demo/hospitals/uz-leuven/supernode:ro
    networks: [model-updates, uz-leuven-clientapp]

  # The startup's code at the hospital (TB4): only the cohort and the final
  # models, and a network that reaches nothing but its SuperNode (R28).
  uz-leuven-clientapp:
    <<: *superexec
    depends_on: [uz-leuven-supernode]
    command: [--runtime-api-address=uz-leuven-supernode:9094, --insecure]
    volumes:
      - ./demo/hospitals/uz-leuven/cohort:/demo/hospitals/uz-leuven/cohort:ro
      - ./demo/hospitals/uz-leuven/final-models:/demo/hospitals/uz-leuven/final-models
    networks: [uz-leuven-clientapp]

  uz-leuven-web:
    <<: *web
    # One container, two servers, each on a name only one network knows: the
    # proxy reaches the pages, the practice only the lab-order endpoint (R21).
    # Either one stopping stops the container, and compose restarts it.
    command:
      - bash
      - -c
      - |
        trap 'kill $$(jobs -p)' TERM INT
        gunicorn web.wsgi --bind=uz-leuven-pages:8000 --workers=2 --access-logfile=- \
          --certfile=/demo/hospitals/uz-leuven/web-tls/certificate.pem \
          --keyfile=/demo/hospitals/uz-leuven/web-tls/key.pem &
        python manage.py serve_messages uz-leuven-lab-orders:8441 &
        wait -n
        exit 1
    restart: unless-stopped
    environment:
      HOSPITAL_DIR: /demo/hospitals/uz-leuven
      HOSPITAL_NAME: UZ Leuven
      PARTY_COLOUR: jade
    volumes:
      - ./demo/hospitals/uz-leuven:/demo/hospitals/uz-leuven
      - ./demo/hospitals/uz-leuven/final-models:/demo/hospitals/uz-leuven/final-models:ro
    # Same organisation, but no need: the web app sees no cohort and no SuperNode key.
    # DEBUG off: Django's deploy settings, HTTPS with the browser CA's certificate (R29).
    tmpfs: [/demo/hospitals/uz-leuven/cohort, /demo/hospitals/uz-leuven/supernode]
    networks:
      uz-leuven: {aliases: [uz-leuven-pages]}
      uz-leuven-lab-orders: {aliases: [uz-leuven-lab-orders]}

  # TB1 and TB4, Heilig Hart Leuven.
  heilig-hart-leuven-supernode:
    <<: *supernode
    command:
      - --superlink=superlink:9092
      - --root-certificates=/demo/hospitals/heilig-hart-leuven/certificates/ca.crt
      - --auth-supernode-private-key=/demo/hospitals/heilig-hart-leuven/supernode/key
      - --isolation=process
      - --host=0.0.0.0
      - --port=9094
      - --node-config=data-path='/demo/hospitals/heilig-hart-leuven/cohort' final-models-path='/demo/hospitals/heilig-hart-leuven/final-models'
    volumes:
      - ./demo/hospitals/heilig-hart-leuven/certificates:/demo/hospitals/heilig-hart-leuven/certificates:ro
      - ./demo/hospitals/heilig-hart-leuven/supernode:/demo/hospitals/heilig-hart-leuven/supernode:ro
    networks: [model-updates, heilig-hart-leuven-clientapp]

  heilig-hart-leuven-clientapp:
    <<: *superexec
    depends_on: [heilig-hart-leuven-supernode]
    command: [--runtime-api-address=heilig-hart-leuven-supernode:9094, --insecure]
    volumes:
      - ./demo/hospitals/heilig-hart-leuven/cohort:/demo/hospitals/heilig-hart-leuven/cohort:ro
      - ./demo/hospitals/heilig-hart-leuven/final-models:/demo/hospitals/heilig-hart-leuven/final-models
    networks: [heilig-hart-leuven-clientapp]

  heilig-hart-leuven-web:
    <<: *web
    # One container, two servers, each on a name only one network knows: the
    # proxy reaches the pages, the practice only the lab-order endpoint (R21).
    # Either one stopping stops the container, and compose restarts it.
    command:
      - bash
      - -c
      - |
        trap 'kill $$(jobs -p)' TERM INT
        gunicorn web.wsgi --bind=heilig-hart-leuven-pages:8000 --workers=2 --access-logfile=- \
          --certfile=/demo/hospitals/heilig-hart-leuven/web-tls/certificate.pem \
          --keyfile=/demo/hospitals/heilig-hart-leuven/web-tls/key.pem &
        python manage.py serve_messages heilig-hart-leuven-lab-orders:8441 &
        wait -n
        exit 1
    restart: unless-stopped
    environment:
      HOSPITAL_DIR: /demo/hospitals/heilig-hart-leuven
      HOSPITAL_NAME: Heilig Hart Leuven
      PARTY_COLOUR: pumpkin
    volumes:
      - ./demo/hospitals/heilig-hart-leuven:/demo/hospitals/heilig-hart-leuven
      - ./demo/hospitals/heilig-hart-leuven/final-models:/demo/hospitals/heilig-hart-leuven/final-models:ro
    tmpfs: [/demo/hospitals/heilig-hart-leuven/cohort, /demo/hospitals/heilig-hart-leuven/supernode]
    networks:
      heilig-hart-leuven: {aliases: [heilig-hart-leuven-pages]}
      heilig-hart-leuven-lab-orders: {aliases: [heilig-hart-leuven-lab-orders]}

  # TB1 and TB4, AZ Diest.
  az-diest-supernode:
    <<: *supernode
    command:
      - --superlink=superlink:9092
      - --root-certificates=/demo/hospitals/az-diest/certificates/ca.crt
      - --auth-supernode-private-key=/demo/hospitals/az-diest/supernode/key
      - --isolation=process
      - --host=0.0.0.0
      - --port=9094
      - --node-config=data-path='/demo/hospitals/az-diest/cohort' final-models-path='/demo/hospitals/az-diest/final-models'
    volumes:
      - ./demo/hospitals/az-diest/certificates:/demo/hospitals/az-diest/certificates:ro
      - ./demo/hospitals/az-diest/supernode:/demo/hospitals/az-diest/supernode:ro
    networks: [model-updates, az-diest-clientapp]

  az-diest-clientapp:
    <<: *superexec
    depends_on: [az-diest-supernode]
    command: [--runtime-api-address=az-diest-supernode:9094, --insecure]
    volumes:
      - ./demo/hospitals/az-diest/cohort:/demo/hospitals/az-diest/cohort:ro
      - ./demo/hospitals/az-diest/final-models:/demo/hospitals/az-diest/final-models
    networks: [az-diest-clientapp]

  az-diest-web:
    <<: *web
    # One container, two servers, each on a name only one network knows: the
    # proxy reaches the pages, the practice only the lab-order endpoint (R21).
    # Either one stopping stops the container, and compose restarts it.
    command:
      - bash
      - -c
      - |
        trap 'kill $$(jobs -p)' TERM INT
        gunicorn web.wsgi --bind=az-diest-pages:8000 --workers=2 --access-logfile=- \
          --certfile=/demo/hospitals/az-diest/web-tls/certificate.pem \
          --keyfile=/demo/hospitals/az-diest/web-tls/key.pem &
        python manage.py serve_messages az-diest-lab-orders:8441 &
        wait -n
        exit 1
    restart: unless-stopped
    environment:
      HOSPITAL_DIR: /demo/hospitals/az-diest
      HOSPITAL_NAME: AZ Diest
      PARTY_COLOUR: violet
    volumes:
      - ./demo/hospitals/az-diest:/demo/hospitals/az-diest
      - ./demo/hospitals/az-diest/final-models:/demo/hospitals/az-diest/final-models:ro
    tmpfs: [/demo/hospitals/az-diest/cohort, /demo/hospitals/az-diest/supernode]
    networks:
      az-diest: {aliases: [az-diest-pages]}
      az-diest-lab-orders: {aliases: [az-diest-lab-orders]}

  # TB3, each general practitioner's practice, sending to its one hospital.
  huisartsenpraktijk-de-akker-web:
    <<: *web
    command: [gunicorn, web.wsgi, --bind=0.0.0.0:8000, --workers=2, --access-logfile=-,
              --certfile=/demo/practices/huisartsenpraktijk-de-akker/web-tls/certificate.pem,
              --keyfile=/demo/practices/huisartsenpraktijk-de-akker/web-tls/key.pem]
    environment:
      PRACTICE_DIR: /demo/practices/huisartsenpraktijk-de-akker
      PRACTICE_NAME: Huisartsenpraktijk De Akker
      PARTY_COLOUR: green
      MESSAGING_ADDRESS: uz-leuven-lab-orders:8441
    volumes:
      - ./demo/practices/huisartsenpraktijk-de-akker:/demo/practices/huisartsenpraktijk-de-akker
    networks: [huisartsenpraktijk-de-akker, uz-leuven-lab-orders]

  huisartsenpraktijk-de-berk-web:
    <<: *web
    command: [gunicorn, web.wsgi, --bind=0.0.0.0:8000, --workers=2, --access-logfile=-,
              --certfile=/demo/practices/huisartsenpraktijk-de-berk/web-tls/certificate.pem,
              --keyfile=/demo/practices/huisartsenpraktijk-de-berk/web-tls/key.pem]
    environment:
      PRACTICE_DIR: /demo/practices/huisartsenpraktijk-de-berk
      PRACTICE_NAME: Huisartsenpraktijk De Berk
      PARTY_COLOUR: amber
      MESSAGING_ADDRESS: heilig-hart-leuven-lab-orders:8441
    volumes:
      - ./demo/practices/huisartsenpraktijk-de-berk:/demo/practices/huisartsenpraktijk-de-berk
    networks: [huisartsenpraktijk-de-berk, heilig-hart-leuven-lab-orders]

  huisartsenpraktijk-de-ceder-web:
    <<: *web
    command: [gunicorn, web.wsgi, --bind=0.0.0.0:8000, --workers=2, --access-logfile=-,
              --certfile=/demo/practices/huisartsenpraktijk-de-ceder/web-tls/certificate.pem,
              --keyfile=/demo/practices/huisartsenpraktijk-de-ceder/web-tls/key.pem]
    environment:
      PRACTICE_DIR: /demo/practices/huisartsenpraktijk-de-ceder
      PRACTICE_NAME: Huisartsenpraktijk De Ceder
      PARTY_COLOUR: purple
      MESSAGING_ADDRESS: az-diest-lab-orders:8441
    volumes:
      - ./demo/practices/huisartsenpraktijk-de-ceder:/demo/practices/huisartsenpraktijk-de-ceder
    networks: [huisartsenpraktijk-de-ceder, az-diest-lab-orders]

  # Between the browser and the parties, like the internet: routes each
  # <party>.localhost by SNI, never decrypting. The only published port.
  proxy:
    image: nginx:1.28-alpine
    user: *user
    depends_on:
      prepare: {condition: service_completed_successfully}
    ports: ["127.0.0.1:${DEMO_HTTPS_PORT:-443}:8443"]
    volumes: ["./docker/sni-proxy.conf:/etc/nginx/nginx.conf:ro"]
    networks:
      [uz-leuven, heilig-hart-leuven, az-diest,
       huisartsenpraktijk-de-akker, huisartsenpraktijk-de-berk, huisartsenpraktijk-de-ceder]

networks:
  setup: {}
  startup: {internal: true}
  model-updates: {internal: true}
  uz-leuven: {}
  uz-leuven-clientapp: {internal: true}
  uz-leuven-lab-orders: {internal: true}
  heilig-hart-leuven: {}
  heilig-hart-leuven-clientapp: {internal: true}
  heilig-hart-leuven-lab-orders: {internal: true}
  az-diest: {}
  az-diest-clientapp: {internal: true}
  az-diest-lab-orders: {internal: true}
  huisartsenpraktijk-de-akker: {}
  huisartsenpraktijk-de-berk: {}
  huisartsenpraktijk-de-ceder: {}
